# ═══════════════════════════════════════════════════════════════════
# DAXELO KINREL — Codemagic CI/CD
# ═══════════════════════════════════════════════════════════════════
# Monorepo: Flutter project is in Daxelo-Kinrel-App/
# This file MUST be at the repository root for Codemagic to find it.
# ═══════════════════════════════════════════════════════════════════

workflows:
  # ─────────────────────────────────────────────────────────────────
  # ANDROID DEBUG APK — auto-triggered on push to main
  # ─────────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m4

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: 3.44.0
      java: '17'
      vars:
        FLUTTER_DIR: Daxelo-Kinrel-App

    scripts:
      # ── Create .env file with hardcoded fallback defaults ────────
      # Codemagic env vars are optional — if not set in the UI,
      # the defaults are used. The app also has hardcoded fallbacks
      # in AppConfig/EnvConfig, so this .env is a safety net.
      - name: Create .env file
        script: |
          DEFAULT_SUPABASE_URL="https://promxswvsnvilplmrtsj.supabase.co"
          DEFAULT_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb214c3d2c252aWxwbG1ydHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTcxODAsImV4cCI6MjA5NTE3MzE4MH0.70VPcCiCItKPx56cH-Y0DmcvWnrBiegmDkjv-V21taY"
          DEFAULT_API_BASE_URL="https://daxelo-kinrel-server.onrender.com"

          FINAL_SUPABASE_URL="${SUPABASE_URL:-$DEFAULT_SUPABASE_URL}"
          FINAL_SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$DEFAULT_SUPABASE_ANON_KEY}"
          FINAL_API_BASE_URL="${API_BASE_URL:-$DEFAULT_API_BASE_URL}"

          echo "SUPABASE_URL=$FINAL_SUPABASE_URL" > "$FLUTTER_DIR/.env"
          echo "SUPABASE_ANON_KEY=$FINAL_SUPABASE_ANON_KEY" >> "$FLUTTER_DIR/.env"
          echo "API_BASE_URL=$FINAL_API_BASE_URL" >> "$FLUTTER_DIR/.env"
          echo ".env file created with Supabase URL: $FINAL_SUPABASE_URL"

      # ── Install Android SDK components ───────────────────────────
      - name: Install Android SDK components
        script: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -n "$ANDROID_HOME" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          else
            echo "ANDROID_HOME not set — assuming SDK already available"
          fi

      # ── Flutter clean ────────────────────────────────────────────
      - name: Flutter clean
        script: cd "$FLUTTER_DIR" && flutter clean

      # ── Flutter pub get ──────────────────────────────────────────
      - name: Flutter pub get
        script: cd "$FLUTTER_DIR" && flutter pub get

      # ── Generate Drift code (build_runner) ───────────────────────
      - name: Generate Drift code
        script: cd "$FLUTTER_DIR" && dart run build_runner build --delete-conflicting-outputs

      # ── Build debug APK ──────────────────────────────────────────
      - name: Build debug APK
        script: |
          BUILD_NUMBER="${CM_BUILD_NUMBER:-1}"
          cd "$FLUTTER_DIR" && flutter build apk --debug --build-number="$BUILD_NUMBER"

    artifacts:
      - Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - roadmapx.support@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────
  # ANDROID SIGNED RELEASE APK — manual trigger only
  # ─────────────────────────────────────────────────────────────────
  android-release:
    name: Android Signed Release
    max_build_duration: 60
    instance_type: mac_mini_m4

    triggering:
      events:
        - manual

    environment:
      flutter: 3.44.0
      java: '17'
      vars:
        KEYSTORE_BASE64:
          required: true
        KEYSTORE_PASSWORD:
          required: true
        KEY_ALIAS:
          required: true
        KEY_PASSWORD:
          required: true

    scripts:
      # ── Decode keystore from environment variable ────────────────
      - name: Decode Android keystore
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > Daxelo-Kinrel-App/android/upload-keystore.jks
          echo "Keystore decoded successfully"

      # ── Create key.properties for Gradle release signing ─────────
      - name: Create key.properties
        script: |
          cat > Daxelo-Kinrel-App/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "key.properties created"

      # ── Create .env file with hardcoded defaults ─────────────────
      - name: Create .env file
        script: |
          DEFAULT_SUPABASE_URL="https://promxswvsnvilplmrtsj.supabase.co"
          DEFAULT_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb214c3d2c252aWxwbG1ydHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTcxODAsImV4cCI6MjA5NTE3MzE4MH0.70VPcCiCItKPx56cH-Y0DmcvWnrBiegmDkjv-V21taY"
          DEFAULT_API_BASE_URL="https://daxelo-kinrel-server.onrender.com"

          FINAL_SUPABASE_URL="${SUPABASE_URL:-$DEFAULT_SUPABASE_URL}"
          FINAL_SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$DEFAULT_SUPABASE_ANON_KEY}"
          FINAL_API_BASE_URL="${API_BASE_URL:-$DEFAULT_API_BASE_URL}"

          echo "SUPABASE_URL=$FINAL_SUPABASE_URL" > Daxelo-Kinrel-App/.env
          echo "SUPABASE_ANON_KEY=$FINAL_SUPABASE_ANON_KEY" >> Daxelo-Kinrel-App/.env
          echo "API_BASE_URL=$FINAL_API_BASE_URL" >> Daxelo-Kinrel-App/.env
          echo ".env file created"

      # ── Install Android SDK & NDK ────────────────────────────────
      - name: Install Android SDK & NDK
        script: |
          if [ -n "$ANDROID_HOME" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          else
            echo "ANDROID_HOME not set — assuming SDK already available"
          fi

      # ── Get Flutter packages ─────────────────────────────────────
      - name: Get Flutter packages
        script: cd Daxelo-Kinrel-App && flutter pub get

      # ── Generate Drift code ──────────────────────────────────────
      - name: Generate Drift code
        script: cd Daxelo-Kinrel-App && dart run build_runner build --delete-conflicting-outputs

      # ── Build signed release APK ─────────────────────────────────
      - name: Build signed release APK
        script: |
          BUILD_NUMBER="${CM_BUILD_NUMBER:-1}"
          cd Daxelo-Kinrel-App && flutter build apk --release --build-number="$BUILD_NUMBER"

      # ── Rename APK with build info ───────────────────────────────
      - name: Rename APK with build info
        script: |
          BUILD_NUMBER="${CM_BUILD_NUMBER:-1}"
          BRANCH=$(echo "${CM_BRANCH:-main}" | tr '/' '-')
          SRC="Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk"
          DST="Daxelo-Kinrel-App/build/app/outputs/flutter-apk/kinrel-${BRANCH}-${BUILD_NUMBER}.apk"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "APK renamed: kinrel-${BRANCH}-${BUILD_NUMBER}.apk"
          else
            echo "WARNING: APK not found at $SRC"
            ls -la Daxelo-Kinrel-App/build/app/outputs/flutter-apk/ || true
          fi

    artifacts:
      - Daxelo-Kinrel-App/build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - roadmapx.support@gmail.com
        notify:
          success: true
          failure: true
