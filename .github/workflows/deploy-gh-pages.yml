# .github/workflows/deploy-gh-pages.yml
#
# Build the Flutter web app and deploy it to GitHub Pages.
#
# This workflow runs on every push to main that touches the Flutter app,
# and also on manual dispatch. It:
#   1. Builds the Flutter web app (release mode)
#   2. Uploads the build/web/ output as a GitHub artifact
#   3. Deploys the artifact to GitHub Pages
#
# The resulting site is served at:
#   https://buildwith-manish.github.io/Daxelo-Kinrel/
#
# PREREQUISITE: GitHub Pages must be enabled in the repo settings
# (Settings → Pages → Source: "GitHub Actions"). This workflow uses
# the modern actions/deploy-pages action which doesn't require a
# gh-pages branch.
#
# NOTE: Vercel is a SEPARATE deployment (https://daxelo-kinrel.vercel.app)
# that builds from main directly. Both deployments serve the same code;
# GitHub Pages is the fallback / open-source-friendly mirror.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/**'
      - 'Daxelo-Kinrel-App/web/**'
      - 'Daxelo-Kinrel-App/pubspec.yaml'
      - 'Daxelo-Kinrel-App/pubspec.lock'
      - 'Daxelo-Kinrel-App/vercel*.sh'
      - 'Daxelo-Kinrel-App/vercel.json'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment per branch
concurrency:
  group: deploy-gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: cd Daxelo-Kinrel-App && flutter pub get

      - name: Generate Drift code
        run: cd Daxelo-Kinrel-App && dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web
        # --base-href must match the GitHub Pages subpath:
        #   https://buildwith-manish.github.io/Daxelo-Kinrel/
        # so the base href is "/Daxelo-Kinrel/". This is CRITICAL — if it's
        # "/" (the Vercel setting), GitHub Pages will fail to load
        # main.dart.js and all assets because they'll be requested from
        # https://buildwith-manish.github.io/ instead of
        # https://buildwith-manish.github.io/Daxelo-Kinrel/
        run: cd Daxelo-Kinrel-App && flutter build web --release --base-href "/Daxelo-Kinrel/"

      - name: Verify build output
        run: |
          if [ ! -f Daxelo-Kinrel-App/build/web/index.html ]; then
            echo "FATAL: build/web/index.html not found!"
            exit 1
          fi
          echo "Build output verified:"
          ls -la Daxelo-Kinrel-App/build/web/ | head -20
          echo ""
          echo "main.dart.js size:"
          ls -lh Daxelo-Kinrel-App/build/web/main.dart.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Daxelo-Kinrel-App/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
