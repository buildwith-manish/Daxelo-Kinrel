# ─────────────────────────────────────────────────────────────────
# Build Signed Release APK — produces a production-signed APK for
# distribution (Play Store or direct install).
#
# This workflow uses GitHub Secrets for signing:
#   KEYSTORE_BASE64    — Base64-encoded .jks keystore
#   KEYSTORE_PASSWORD  — Keystore password
#   KEY_ALIAS          — Key alias
#   KEY_PASSWORD       — Key password
#
# If secrets are not set, it builds an unsigned release APK instead.
# ─────────────────────────────────────────────────────────────────
name: Build Signed Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main, feature-registry]
    paths:
      - 'Daxelo-Kinrel-App/lib/**'
      - 'Daxelo-Kinrel-App/pubspec.yaml'
      - 'Daxelo-Kinrel-App/android/**'
      - '.github/workflows/signed-release-apk.yml'

concurrency:
  group: signed-release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          # Ubuntu 26.04 (resolute) runner image dropped the runtime-
          # only packages libc++1-19 / libc++abi1-19 / libunwind-19 —
          # they're now subsumed by the corresponding -dev packages
          # (which pull the runtime .so as a dependency). Install the
          # -dev variants only.
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++abi-19-dev libunwind-19-dev

      - name: Install Android SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # Phase A (#5 follow-up) — install NDK 27.0.12077973
          # (Flutter's preferred stable NDK). The app's
          # android/build.gradle.kts subprojects {} block overrides
          # ALL sub-projects' ndkVersion to 27.0.12077973 — including
          # thermion_flutter's :jni bridge which originally hardcoded
          # 28.2.13676358 (a beta version no longer downloadable).
          #
          # ANDROID_NDK_HOME + NDK_HOME are exported so the :jni
          # sub-project (thermion_dart's JNI bridge) can locate the
          # installed NDK path — it doesn't inherit :app's ndkVersion.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;27.0.12077973" \
            "platforms;android-36" "platforms;android-33" \
            "build-tools;35.0.1" "cmake;3.22.1" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Debug — verify what NDK versions are actually installed
          # at the expected path. The sdkmanager sometimes uses a
          # short version number as the directory name (e.g. "27"
          # instead of "27.0.12077973").
          echo "=== NDK install path verification ==="
          ls -la $ANDROID_HOME/ndk/ 2>&1 || echo "ndk/ dir does not exist"
          echo "=== Resolved NDK path ==="
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1 || echo "")
          echo "Resolved: $NDK_DIR"
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" | sed 's:/$::' >> $GITHUB_ENV
            echo "NDK_HOME=$NDK_DIR" | sed 's:/$::' >> $GITHUB_ENV
          else
            echo "⚠️ No NDK found at $ANDROID_HOME/ndk/ — falling back to hardcoded path"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          fi
          echo "=== Final env ==="
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "NDK_HOME=$NDK_HOME"

      - name: Enable native assets
        run: flutter config --enable-native-assets

      # ── QA hardening 2026-09-20 ────────────────────────────────
      # Replaced the old "Create .env file" step (which wrote a file
      # that was never bundled — .env is not a pubspec asset — while the
      # build silently ran on the hardcoded fallbacks AppConfig used to
      # carry). The keys are now injected at compile time via
      # --dart-define from repo secrets, and missing secrets fail the
      # build LOUDLY before any compile time is wasted.
      - name: Verify Supabase config secrets (fail loudly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (lib/ only, no fatal warnings/infos)
        # Analyze lib/ only (skip pre-existing test-file errors that
        # are unrelated to production code) + treat both warnings and
        # infos as non-fatal so they don't block the APK build. Real
        # `error`-level lints will still fail the step.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/

      - name: Decode signing keystore (if secrets available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ℹ️ No keystore secret — building unsigned release"
            echo "SIGNED=false" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "SIGNED=true" >> $GITHUB_ENV
          fi

      - name: Create key.properties (if signed)
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          storeFile=keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --debug --target-platform android-arm64
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify libthermion_dart.so in APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -l $APK | grep -q "libthermion_dart.so"; then
            echo "❌ libthermion_dart.so NOT in APK"
            exit 1
          fi
          echo "✅ libthermion_dart.so verified in APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-signed-release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-debug-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/keystore.jks android/key.properties
