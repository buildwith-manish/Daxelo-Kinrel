# ─────────────────────────────────────────────────────────────────
# Build Signed Release APK — produces a production-signed APK for
# distribution (Play Store or direct install).
#
# This workflow uses GitHub Secrets for signing:
#   KEYSTORE_BASE64    — Base64-encoded .jks keystore
#   KEYSTORE_PASSWORD  — Keystore password
#   KEY_ALIAS          — Key alias
#   KEY_PASSWORD       — Key password
#
# If secrets are not set, it builds an unsigned release APK instead.
# ─────────────────────────────────────────────────────────────────
name: Build Signed Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/**'
      - 'Daxelo-Kinrel-App/pubspec.yaml'
      - 'Daxelo-Kinrel-App/android/**'

concurrency:
  group: signed-release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Install Android SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;28.2.13676358" "platforms;android-36" "platforms;android-33" \
            "build-tools;35.0.1" "cmake;3.22.1" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Decode signing keystore (if secrets available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ℹ️ No keystore secret — building unsigned release"
            echo "SIGNED=false" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "SIGNED=true" >> $GITHUB_ENV
          fi

      - name: Create key.properties (if signed)
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          storeFile=keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify libthermion_dart.so in APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -l $APK | grep -q "libthermion_dart.so"; then
            echo "❌ libthermion_dart.so NOT in APK"
            exit 1
          fi
          echo "✅ libthermion_dart.so verified in APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-signed-release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-debug-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/keystore.jks android/key.properties
