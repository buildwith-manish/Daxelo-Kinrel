name: Phase 12 — Master Prompt Quick CI

# Lightweight quick-CI that runs on EVERY push to main (no path filter).
# Catches syntax / formatting / analyze regressions fast (~3-4 min).
# The full master-prompt verification lives in
# phase-12-master-prompt-verification.yml (runs only on family_map changes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quick-ci:
    name: Flutter format + analyze + family_map tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify dart formatting (family_map only)
        run: dart format --set-exit-if-changed lib/features/family_map/ test/features/family_map/

      - name: Analyze family_map
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/family_map/

      - name: Run family_map tests (excluding golden + perf)
        run: flutter test test/features/family_map/ --exclude-tags golden --exclude-tags perf --reporter expanded
