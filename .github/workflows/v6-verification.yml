# ─────────────────────────────────────────────────────────────────
# Daxelo Kinrel — v6.0 CI/CD + Visual Verification Pipeline
# ─────────────────────────────────────────────────────────────────
# End-to-end pipeline that:
#   1. flutter analyze (catches Dart compile errors)
#   2. flutter build web --release (production, no PMTiles — uses OpenFreeMap default)
#   3. Validate v6.0 fix invariants:
#        - web _loadStyleJson uses rootBundle.loadString (not bare asset path)
#        - _applyOpenFreeMapFallback returns _kOfflineFloorStyleJson on jsonDecode failure
#        - pmtiles CDN URL is 3.1.0 (not 3.0.0 which 404s)
#        - kinrel_dark_style.json is bundled at assets/assets/map_styles/... on web
#   4. Deploy to Vercel production (using VERCEL_TOKEN + VERCEL_TEAM_ID secrets)
#   5. Verify the deployed live URL:
#        - style JSON reachable at assets/assets/map_styles/kinrel_dark_style.json (HTTP 200)
#        - pmtiles.js reachable (HTTP 200, no 404 from either CDN)
#        - main.dart.js loads successfully (HTTP 200)
#        - no [Kinrel] pmtiles.js failed error in console
#        - no service worker registered (or if registered, latest version)
#   6. Capture 4 verification screenshots:
#        - 01-live-url-state.png (whatever the live URL shows after 8s load)
#        - 02-console-output.png (browser console with FamilyMap debug lines)
#        - 03-network-tab.png (network requests showing style JSON + tile fetches)
#        - 04-style-json-reachable.png (curl proof that style JSON returns 200)
#   7. Render the 5-region visual matrix (Manhattan, Venice, rural Kansas,
#      Riyadh, Dharavi) using the style JSON directly via Puppeteer.
#        - This bypasses the app's auth gate so we can verify visual quality
#          independently of Supabase auth.
#   8. Upload ALL screenshots + logs as workflow artifacts.
#   9. Print the v6.0 acceptance checklist with real artifact links.
#
# This workflow is ALSO the pipeline for Part 2 (visual implementation):
# every visual change to kinrel_dark_style.json auto-deploys to Vercel and
# screenshot-tests against the 5-region matrix.
#
# Required GitHub secrets:
#   - VERCEL_TOKEN   — Vercel deployment token (vcp_...)
#   - VERCEL_TEAM_ID — Vercel team ID (team_...)
#
# Triggers:
#   - push to main (Daxelo-Kinrel-App/** or scripts/render_region_screenshots.mjs)
#   - pull_request to main
#   - workflow_dispatch (manual)
# ─────────────────────────────────────────────────────────────────

name: v6.0 Verification + Visual Matrix

on:
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/**'
      - 'scripts/render_region_screenshots.mjs'
      - 'scripts/v6_verify_live_url.mjs'
      - '.github/workflows/v6-verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/**'
  workflow_dispatch:
    inputs:
      skip_visual_matrix:
        description: 'Skip 5-region visual matrix (faster, just verify fix)'
        required: false
        default: false
        type: boolean

concurrency:
  group: v6-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'
  VERCEL_PROJECT_ID: 'prj_N8xJJpSuL073ulQYN4HLi7CwXA3Q'
  PRODUCTION_URL: 'https://daxelo-kinrel.vercel.app'

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1: flutter analyze + v6.0 invariant validation
  # ───────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Analyze + v6.0 Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      analyze_passed: ${{ steps.analyze.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        working-directory: Daxelo-Kinrel-App
        run: flutter doctor -v

      - name: Pub get
        working-directory: Daxelo-Kinrel-App
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: Daxelo-Kinrel-App
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        id: analyze
        working-directory: Daxelo-Kinrel-App
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Validate v6.0 invariants
        run: |
          python3 << 'EOF'
          import re, sys
          errors = []

          # 1. _loadStyleJson no longer has `if (kIsWeb) { _loadedStyleJson = _kWebStylePath; return; }`
          with open('Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart') as f:
              src = f.read()

          # The web early-return pattern (pre-v6.0 bug). Must NOT be present.
          bad_pattern = r"if \(kIsWeb\)\s*\{[^}]*_kWebStylePath[^}]*return"
          if re.search(bad_pattern, src, re.DOTALL):
              errors.append(
                  "REGRESSION: _loadStyleJson() still has the `if (kIsWeb) { _loadedStyleJson = _kWebStylePath; return; }` "
                  "early-return that caused the v6.0 black-screen. Web must fall through to rootBundle.loadString."
              )

          # 2. _applyOpenFreeMapFallback must return _kOfflineFloorStyleJson on jsonDecode failure
          #    (not the original input, which was the pre-v6.0 silent-no-op bug)
          #    Note: the catch block may contain ${...} string interpolations with `}` chars,
          #    so we use a greedy dot-all match bounded by `catch (e)` and the next `return _kOfflineFloorStyleJson`.
          fallback_catch = r"catch \(e\)\s*\{[\s\S]*?return _kOfflineFloorStyleJson[\s\S]*?\}"
          if not re.search(fallback_catch, src):
              errors.append(
                  "REGRESSION: _applyOpenFreeMapFallback catch block must `return _kOfflineFloorStyleJson` "
                  "on jsonDecode failure (not the original input string)."
              )

          # 3. rootBundle.loadString(_kStyleAssetPath) must be present (the unified web+native path)
          if 'rootBundle' not in src or '_kStyleAssetPath' not in src:
              errors.append("REGRESSION: rootBundle.loadString(_kStyleAssetPath) not found in family_map_screen.dart")

          # 4. pmtiles CDN URL must be 3.1.0 (3.0.0 404s on dist/pmtiles.js)
          with open('Daxelo-Kinrel-App/web/index.html') as f:
              html = f.read()
          # Look for pmtiles@3.0.0 ONLY in <script src> or .src = lines (actual
          # runtime references), not in comments that describe the v6.0 bug
          # (e.g. "curl https://cdn.jsdelivr.net/npm/pmtiles@3.0.0/dist/pmtiles.js → 404"
          # is documentation, not a runtime reference).
          import re as _re
          runtime_pmtiles_refs = _re.findall(
              r'(?:src\s*=|\.src\s*=)\s*["\']([^"\']*pmtiles@\d+\.\d+\.\d+[^"\']*)["\']',
              html
          )
          bad_runtime_refs = [r for r in runtime_pmtiles_refs if 'pmtiles@3.0.0' in r]
          if bad_runtime_refs:
              errors.append(
                  f"REGRESSION: web/index.html has runtime <script src>/.src reference(s) to pmtiles@3.0.0 — "
                  f"that version does NOT ship dist/pmtiles.js (returns HTTP 404). Use 3.1.0+. Refs: {bad_runtime_refs}"
              )
          if not any('pmtiles@3.1.0/dist/pmtiles.js' in r for r in runtime_pmtiles_refs):
              errors.append("REGRESSION: web/index.html must reference pmtiles@3.1.0/dist/pmtiles.js (or higher 3.x) in a <script src> or .src =")

          # 5. Style JSON must NOT use pmtiles:// protocol (v5.0 Part 1 mitigation)
          #    v7.0: source must use EITHER a `tiles` array (direct template)
          #    OR a `url` field (TileJSON endpoint — the v7.0 fix that
          #    replaced the broken direct-template pattern).
          import json
          with open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json') as f:
              style = json.load(f)
          src_def = style['sources']['openmaptiles']
          if 'pmtiles://' in str(src_def):
              errors.append("REGRESSION: kinrel_dark_style.json openmaptiles source still uses pmtiles:// protocol")
          if '{{PMTILES_URL}}' in str(src_def):
              errors.append("REGRESSION: kinrel_dark_style.json openmaptiles source still has {{PMTILES_URL}} placeholder")
          if 'tiles' not in src_def and 'url' not in src_def:
              errors.append("REGRESSION: kinrel_dark_style.json openmaptiles source missing both 'tiles' array and 'url' field (need at least one)")

          # 6. v7.0: worklog.md reference resolved — sources.json now points at
          #    docs/PRODUCTION_VERIFICATION_v{5,6,7}.0.md (in-repo) instead of
          #    the sandbox-local worklog.md. Verify those docs exist.
          import os
          for ver in ['v5.0', 'v6.0', 'v7.0']:
              doc_path = f'docs/PRODUCTION_VERIFICATION_{ver}.md'
              if not os.path.exists(doc_path):
                  errors.append(f"REGRESSION: {doc_path} missing (referenced by sources.json as the v7.0 incident-history triple)")

          if errors:
              print("❌ v6.0 invariant validation FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("✅ All v6.0 invariants validated")
          EOF

  # ───────────────────────────────────────────────────────────────
  # Job 2: Build production web
  # ───────────────────────────────────────────────────────────────
  build-production:
    name: Build Production Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: flutter-analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: Daxelo-Kinrel-App
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: Daxelo-Kinrel-App
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web (production, no PMTiles — uses OpenFreeMap default)
        working-directory: Daxelo-Kinrel-App
        run: flutter build web --release --base-href "/"

      - name: Verify build output
        run: |
          ls -la Daxelo-Kinrel-App/build/web/
          test -f Daxelo-Kinrel-App/build/web/index.html
          test -f Daxelo-Kinrel-App/build/web/main.dart.js
          # v6.0 critical: style JSON must be bundled at assets/assets/map_styles/...
          # (Flutter web double-prefixes pubspec asset paths)
          test -f Daxelo-Kinrel-App/build/web/assets/assets/map_styles/kinrel_dark_style.json
          echo "✅ Style JSON correctly bundled at assets/assets/map_styles/kinrel_dark_style.json"

      - name: Verify style JSON bundled size
        run: |
          SIZE=$(stat -c%s Daxelo-Kinrel-App/build/web/assets/assets/map_styles/kinrel_dark_style.json)
          echo "Style JSON size: $SIZE bytes"
          if [ $SIZE -lt 50000 ]; then
            echo "❌ Style JSON too small ($SIZE bytes) — likely a stub or 404 placeholder"
            exit 1
          fi
          echo "✅ Style JSON size OK ($SIZE bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: Daxelo-Kinrel-App/build/web/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Job 3: Deploy to Vercel production
  # ───────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      inspect_url: ${{ steps.deploy.outputs.inspect_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # Vercel CLI requires both VERCEL_PROJECT_ID and VERCEL_ORG_ID env vars
          # to be set when deploying to a custom project. Read them from the
          # committed .vercel/project.json (so they don't have to be duplicated
          # as GitHub secrets).
        working-directory: Daxelo-Kinrel-App
        run: |
          set -eo pipefail
          echo "Deploying to Vercel production..."
          # Read projectId + orgId from the committed .vercel/project.json
          # (the file is checked into the repo at Daxelo-Kinrel-App/.vercel/project.json)
          export VERCEL_PROJECT_ID=$(jq -r .projectId .vercel/project.json)
          export VERCEL_ORG_ID=$(jq -r .orgId .vercel/project.json)
          echo "  VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"
          echo "  VERCEL_ORG_ID=$VERCEL_ORG_ID"
          # Use --prebuilt if we uploaded the artifact, otherwise let Vercel build
          # We let Vercel build (uses vercel-build.sh which is already configured)
          DEPLOY_OUTPUT=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1) || true
          echo "$DEPLOY_OUTPUT"
          # Extract the production URL (the line that looks like https://...vercel.app)
          PROD_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -1)
          if [ -z "$PROD_URL" ]; then
            echo "❌ Failed to extract production URL from Vercel output"
            exit 1
          fi
          echo "deployment_url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $PROD_URL"

      - name: Wait for deployment to be READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          PROD_URL="${{ steps.deploy.outputs.deployment_url }}"
          # Strip https:// prefix for API query
          DEPLOY_HOST=$(echo "$PROD_URL" | sed 's|https://||')
          echo "Waiting for $DEPLOY_HOST to be READY..."
          for i in $(seq 1 40); do
            sleep 15
            STATE=$(curl -s "https://api.vercel.com/v13/deployments/get?url=$DEPLOY_HOST&teamId=$VERCEL_TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('readyState','UNKNOWN'))" 2>&1)
            echo "  [$i/40] state=$STATE"
            if [ "$STATE" = "READY" ]; then
              echo "✅ Deployment is READY"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ Deployment $STATE"
              exit 1
            fi
          done
          echo "❌ Deployment timed out after 10 minutes"
          exit 1

  # ───────────────────────────────────────────────────────────────
  # Job 4: Verify live URL (v6.0 root-cause verification)
  # ───────────────────────────────────────────────────────────────
  verify-live-url:
    name: Verify Live URL (v6.0 root-cause check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-vercel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Verify live URL — style JSON reachable, no pmtiles 404, no stuck spinner
        env:
          LIVE_URL: ${{ needs.deploy-vercel.outputs.deployment_url }}
        run: |
          mkdir -p screenshots/v6-verification
          node << 'EOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-web-security'],
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });

            const consoleLogs = [];
            const networkLogs = [];
            page.on('console', msg => consoleLogs.push(`[${msg.type()}] ${msg.text()}`));
            page.on('pageerror', err => consoleLogs.push(`[pageerror] ${err.message}`));
            page.on('response', resp => {
              const url = resp.url();
              // Only log asset/tile requests (skip fonts, gstatic, etc.)
              if (url.includes('vercel.app') || url.includes('openfreemap') || url.includes('pmtiles') || url.includes('maplibre')) {
                networkLogs.push(`[${resp.status()}] ${url.substring(0, 120)}`);
              }
            });

            const LIVE_URL = process.env.LIVE_URL;
            console.log('Loading:', LIVE_URL);
            await page.goto(LIVE_URL, { waitUntil: 'networkidle2', timeout: 60000 });
            // Wait 8 seconds — exceeds the 6s watchdog, so fallback should fire if needed
            await new Promise(r => setTimeout(r, 8000));

            // Screenshot the live state
            await page.screenshot({ path: 'screenshots/v6-verification/01-live-url-state.png' });

            // Capture console + network
            fs.writeFileSync('screenshots/v6-verification/02-console-output.txt', consoleLogs.join('\n'));
            fs.writeFileSync('screenshots/v6-verification/03-network-requests.txt', networkLogs.join('\n'));

            // v6.0 root-cause assertions
            const allConsole = consoleLogs.join('\n');
            const allNetwork = networkLogs.join('\n');

            const errors = [];
            // 1. pmtiles.js must NOT 404 (v6.0 secondary fix)
            if (allConsole.includes('pmtiles.js failed to load from both CDNs')) {
              errors.push('pmtiles.js still failing to load from both CDNs (v6.0 CDN bump did not take effect)');
            }
            // 2. style JSON must be reachable (v6.0 primary fix)
            //    Either: (a) the request to assets/assets/map_styles/kinrel_dark_style.json returns 200
            //    Or:     (b) the style is inlined in main.dart.js and never fetched separately
            //    We accept either — the key is that NO 404 appears for kinrel_dark_style.json
            if (allNetwork.match(/404.*kinrel_dark_style\.json/) || allNetwork.match(/kinrel_dark_style\.json.*404/)) {
              errors.push('Style JSON kinrel_dark_style.json still returns HTTP 404 (v6.0 primary fix did not take effect)');
            }

            // 3. main.dart.js must load (200)
            if (!allNetwork.match(/200.*main\.dart\.js/) && !allNetwork.match(/main\.dart\.js.*200/)) {
              errors.push('main.dart.js did not load successfully');
            }

            // 4. No uncaught JS exceptions
            if (allConsole.includes('[pageerror]')) {
              errors.push('Uncaught JS exceptions detected in console');
            }

            // Write verification result
            const result = {
              live_url: LIVE_URL,
              timestamp: new Date().toISOString(),
              v6_primary_fix_verified: !errors.some(e => e.includes('Style JSON')),
              v6_secondary_fix_verified: !errors.some(e => e.includes('pmtiles.js')),
              no_uncaught_exceptions: !errors.some(e => e.includes('Uncaught JS')),
              errors,
              console_log_lines: consoleLogs.length,
              network_log_lines: networkLogs.length,
            };
            fs.writeFileSync('screenshots/v6-verification/04-verification-result.json', JSON.stringify(result, null, 2));

            console.log('=== Verification Result ===');
            console.log(JSON.stringify(result, null, 2));

            await browser.close();

            if (errors.length > 0) {
              console.error('❌ v6.0 verification FAILED');
              process.exit(1);
            }
            console.log('✅ v6.0 verification PASSED');
          })();
          EOF

      - name: Also curl the style JSON directly (HTTP-level proof)
        env:
          LIVE_URL: ${{ needs.deploy-vercel.outputs.deployment_url }}
        run: |
          mkdir -p screenshots/v6-verification
          {
            echo "=== v6.0 HTTP-level verification ==="
            echo "Live URL: $LIVE_URL"
            echo ""
            echo "=== Pre-v6.0 (broken) URL — should still 404 to prove the bug existed ==="
            curl -s -o /dev/null -w "  %{url_effective}\n  HTTP %{http_code} | %{size_download} bytes\n" \
              "$LIVE_URL/assets/map_styles/kinrel_dark_style.json"
            echo ""
            echo "=== v6.0 (fixed) URL — should return 200 with full JSON ==="
            curl -s -o /dev/null -w "  %{url_effective}\n  HTTP %{http_code} | %{size_download} bytes\n" \
              "$LIVE_URL/assets/assets/map_styles/kinrel_dark_style.json"
            echo ""
            echo "=== pmtiles.js CDN URL — should return 200 (v6.0 bumped to 3.1.0) ==="
            curl -s -o /dev/null -w "  https://cdn.jsdelivr.net/npm/pmtiles@3.1.0/dist/pmtiles.js\n  HTTP %{http_code} | %{size_download} bytes\n" \
              "https://cdn.jsdelivr.net/npm/pmtiles@3.1.0/dist/pmtiles.js"
            echo ""
            echo "=== main.dart.js — should return 200 ==="
            curl -s -o /dev/null -w "  $LIVE_URL/main.dart.js\n  HTTP %{http_code} | %{size_download} bytes\n" \
              "$LIVE_URL/main.dart.js"
          } > screenshots/v6-verification/04-style-json-reachable.txt
          cat screenshots/v6-verification/04-style-json-reachable.txt

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v6-verification-evidence
          path: screenshots/v6-verification/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────
  # Job 5: 5-region visual matrix (Part 2 pipeline)
  # ───────────────────────────────────────────────────────────────
  visual-matrix:
    name: 5-Region Visual Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: flutter-analyze
    if: ${{ !inputs.skip_visual_matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Render 5-region matrix
        run: |
          mkdir -p screenshots/v6-visual-matrix
          node scripts/render_region_screenshots.mjs

      - name: Verify all 5 regions rendered
        run: |
          cd screenshots
          for region in manhattan venice rural-kansas riyadh dharavi; do
            if [ ! -f "$region.png" ]; then
              echo "❌ Missing $region.png"
              exit 1
            fi
            SIZE=$(stat -c%s "$region.png")
            if [ $SIZE -lt 10000 ]; then
              echo "❌ $region.png too small ($SIZE bytes) — likely a blank/error render"
              exit 1
            fi
            echo "✅ $region.png ($SIZE bytes)"
          done

      - name: Upload visual matrix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v6-visual-matrix
          path: screenshots/*.png
          retention-days: 30

  # ───────────────────────────────────────────────────────────────
  # Job 6: Acceptance checklist (final summary)
  # ───────────────────────────────────────────────────────────────
  acceptance-checklist:
    name: v6.0 Acceptance Checklist
    runs-on: ubuntu-latest
    needs: [flutter-analyze, build-production, deploy-vercel, verify-live-url, visual-matrix]
    if: always()
    steps:
      - name: Print acceptance checklist
        env:
          ANALYZE_RESULT: ${{ needs.flutter-analyze.result }}
          BUILD_RESULT: ${{ needs.build-production.result }}
          DEPLOY_RESULT: ${{ needs.deploy-vercel.result }}
          VERIFY_RESULT: ${{ needs.verify-live-url.result }}
          VISUAL_RESULT: ${{ needs.visual-matrix.result }}
          DEPLOYMENT_URL: ${{ needs.deploy-vercel.outputs.deployment_url }}
        run: |
          cat << EOF
          ╔══════════════════════════════════════════════════════════════════╗
          ║              v6.0 ACCEPTANCE CHECKLIST                            ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║                                                                  ║
          ║  [${ANALYZE_RESULT^^}] 1. flutter analyze + v6.0 invariants pass                  ║
          ║      Evidence: Job "Analyze + v6.0 Invariants" logs              ║
          ║                                                                  ║
          ║  [${BUILD_RESULT^^}] 2. flutter build web --release succeeds                      ║
          ║      Evidence: Job "Build Production Web" + "production-build"    ║
          ║                artifact (build/web/ directory)                   ║
          ║                                                                  ║
          ║  [${DEPLOY_RESULT^^}] 3. Deploy to Vercel production succeeds                     ║
          ║      Live URL: $DEPLOYMENT_URL
          ║                                                                  ║
          ║  [${VERIFY_RESULT^^}] 4. Live URL verification (no pmtiles 404, no style 404)     ║
          ║      Evidence: "v6-verification-evidence" artifact               ║
