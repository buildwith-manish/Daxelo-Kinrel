name: Flutter Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Match the version pinned in flutter-web-lighthouse.yml
          # (.replit pins stable-25_05; SDK constraint in pubspec is ^3.12.0).
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── Scoped test suites ──────────────────────────────────────────
      #
      # The full `flutter test` suite has ~70 pre-existing failures in
      # unrelated test files (missing indian_kinship.json asset, broken
      # game test code, API mismatches in heart_shape/graph_lighting
      # tests, etc.). Those are tracked separately. This workflow runs
      # the test files relevant to the 4 bugs being fixed in this PR
      # series (Phase 0 dedup, Phase 4 branch collapse, Phase 7
      # validation, Phase 10 integration) so CI can validate each fix
      # without being blocked by the pre-existing noise.
      #
      # Each suite is a separate step so a failure in one doesn't skip
      # the others — we see ALL results in one run.

      - name: Run edge dedup tests (Bug 1)
        run: flutter test test/graph/engine/edge_dedup_test.dart --reporter expanded

      - name: Run canonical edge pipeline tests (Bug 1)
        run: flutter test test/features/family/canonical_edge_pipeline_test.dart --reporter expanded

      - name: Run branch collapse state tests (Bug 2)
        run: flutter test test/graph/interaction/branch_collapse_state_test.dart --reporter expanded

      - name: Run couple union model tests
        run: flutter test test/graph/interaction/couple_union_model_test.dart --reporter expanded

      - name: Run union edge routing tests
        run: flutter test test/graph/interaction/union_edge_routing_test.dart --reporter expanded

      - name: Run relationship validation tests (Bug 3)
        run: flutter test test/graph/interaction/relationship_validation_test.dart --reporter expanded
