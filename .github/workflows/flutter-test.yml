name: Flutter Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Match the version pinned in flutter-web-lighthouse.yml
          # (.replit pins stable-25_05; SDK constraint in pubspec is ^3.12.0).
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── Scoped test suites ──────────────────────────────────────────
      #
      # The full `flutter test` suite has ~70 pre-existing failures in
      # unrelated test files (missing indian_kinship.json asset, broken
      # game test code, API mismatches in heart_shape/graph_lighting
      # tests, etc.). Those are tracked separately. This workflow runs
      # the test files relevant to the 4 bugs being fixed in this PR
      # series (Phase 0 dedup, Phase 4 branch collapse, Phase 7
      # validation, Phase 10 integration) so CI can validate each fix
      # without being blocked by the pre-existing noise.
      #
      # Each suite has `continue-on-error: true` so a failure in one
      # does NOT skip the others — we see ALL results in one run. The
      # final "Test summary" step fails the job if any suite failed.

      - name: Run edge dedup tests (Bug 1)
        id: edge_dedup
        run: flutter test test/graph/engine/edge_dedup_test.dart --reporter expanded
        continue-on-error: true

      - name: Run canonical edge pipeline tests (Bug 1)
        id: canonical
        run: flutter test test/features/family/canonical_edge_pipeline_test.dart --reporter expanded
        continue-on-error: true

      - name: Run branch collapse state tests (Bug 2)
        id: branch_collapse
        run: flutter test test/graph/interaction/branch_collapse_state_test.dart --reporter expanded
        continue-on-error: true

      - name: Run couple union model tests
        id: couple_union
        run: flutter test test/graph/interaction/couple_union_model_test.dart --reporter expanded
        continue-on-error: true

      - name: Run union edge routing tests
        id: union_routing
        run: flutter test test/graph/interaction/union_edge_routing_test.dart --reporter expanded
        continue-on-error: true

      - name: Run relationship validation tests (Bug 3)
        id: rel_validation
        run: flutter test test/graph/interaction/relationship_validation_test.dart --reporter expanded
        continue-on-error: true

      - name: Run semantic zoom tests (semantic-zoom fix)
        id: semantic_zoom
        run: flutter test test/graph/rendering/semantic_zoom_test.dart --reporter expanded
        continue-on-error: true

      - name: Run LOD threshold tests
        id: lod_threshold
        run: flutter test test/graph/rendering/lod_threshold_test.dart --reporter expanded
        continue-on-error: true

      - name: Run integration test (Bug 4)
        id: integration
        run: flutter test test/graph/widgets/family_graph_integration_test.dart --reporter expanded
        continue-on-error: true

      # ── P3.1: Spring physics gesture response ──────────────────
      # Hard gate (no continue-on-error) — the spring palette must
      # converge within 500ms with <2% overshoot, and reduced-motion
      # must snap instantly. Per P3.1 acceptance criteria.
      - name: Run spring physics tests (P3.1)
        id: spring_physics
        run: flutter test test/graph/interaction/spring_physics_test.dart --reporter expanded

      # ── P3.2: Haptic feedback language ─────────────────────────
      # Hard gate — all haptics must go through GraphHaptics and
      # respect reduced motion.
      - name: Run haptic language tests (P3.2)
        id: haptic_language
        run: flutter test test/graph/interaction/haptic_language_test.dart --reporter expanded

      # ── P3.3: Birthday glow on near-birthday nodes ────────────
      # Hard gate — isNearBirthday date math + reduced-motion fallback.
      - name: Run birthday pulse tests (P3.3)
        id: birthday_pulse
        run: flutter test test/graph/rendering/birthday_pulse_test.dart --reporter expanded

      # ── P3.4: Memorial candle for deceased nodes ──────────────
      # Hard gate — candle alpha range + reduced-motion fallback.
      - name: Run memorial candle tests (P3.4)
        id: memorial_candle
        run: flutter test test/graph/rendering/memorial_candle_test.dart --reporter expanded

      # ── P3.5: Ambient particle layer around anchor node ───────
      # Hard gate — mote count, drift bounds, reduced-motion fallback.
      - name: Run ambient particle tests (P3.5)
        id: ambient_particle
        run: flutter test test/graph/rendering/ambient_particle_test.dart --reporter expanded

      # ── P3.6: Heritage/sepia texture on ancestor nodes ────────
      # Hard gate — sepia matrix coefficients + application by generation.
      - name: Run heritage sepia tests (P3.6)
        id: heritage_sepia
        run: flutter test test/graph/rendering/heritage_sepia_test.dart --reporter expanded

      # ── P3.7: "On this day" resurfacing in-graph ────────────
      - name: Run on this day badge tests (P3.7)
        id: on_this_day_badge
        run: flutter test test/graph/widgets/on_this_day_badge_test.dart --reporter expanded

      # ── P4.1: Mini-map for large graphs ────────────────────────
      - name: Run graph minimap tests (P4.1)
        id: graph_minimap
        run: flutter test test/graph/widgets/graph_minimap_test.dart --reporter expanded

      # ── P4.2: Persistent "Find Myself" button ─────────────────
      - name: Run find myself button tests (P4.2)
        id: find_myself_button
        run: flutter test test/graph/widgets/find_myself_button_test.dart --reporter expanded

      # ── P4.3: Fix 44px legend toggle (WCAG 2.5.5) ────────────
      - name: Run legend toggle 44px tests (P4.3)
        id: legend_toggle_44px
        run: flutter test test/graph/widgets/legend_toggle_44px_test.dart --reporter expanded

      # ── P4.4: Real keyboard navigation wiring ─────────────────
      - name: Run keyboard navigation tests (P4.4)
        id: keyboard_navigation
        run: flutter test test/graph/interaction/keyboard_navigation_test.dart --reporter expanded

      # ── P4.5: Screen-reader graph overview / outline-list view ─
      - name: Run graph outline view tests (P4.5)
        id: graph_outline_view
        run: flutter test test/graph/widgets/graph_outline_view_test.dart --reporter expanded

      # ── P4.6: High-contrast theme + contrast tests ────────────
      - name: Run WCAG contrast tests (P4.6)
        id: wcag_contrast
        run: flutter test test/core/constants/wcag_contrast_test.dart --reporter expanded

      - name: Test summary
        if: always()
        run: |
          echo "=== Test Suite Results ==="
          echo "edge_dedup (Bug 1):        ${{ steps.edge_dedup.outcome }}"
          echo "canonical (Bug 1):         ${{ steps.canonical.outcome }}"
          echo "branch_collapse (Bug 2):   ${{ steps.branch_collapse.outcome }}"
          echo "couple_union:              ${{ steps.couple_union.outcome }}"
          echo "union_routing:             ${{ steps.union_routing.outcome }}"
          echo "rel_validation (Bug 3):    ${{ steps.rel_validation.outcome }}"
          echo "semantic_zoom:             ${{ steps.semantic_zoom.outcome }}"
          echo "lod_threshold:             ${{ steps.lod_threshold.outcome }}"
          echo "integration (Bug 4):       ${{ steps.integration.outcome }}"
          echo "spring_physics (P3.1):    ${{ steps.spring_physics.outcome }}"
          echo "haptic_language (P3.2):   ${{ steps.haptic_language.outcome }}"
          echo "birthday_pulse (P3.3):    ${{ steps.birthday_pulse.outcome }}"
          echo "memorial_candle (P3.4):   ${{ steps.memorial_candle.outcome }}"
          echo "ambient_particle (P3.5):  ${{ steps.ambient_particle.outcome }}"
          echo "heritage_sepia (P3.6):    ${{ steps.heritage_sepia.outcome }}"
          echo "on_this_day_badge (P3.7): ${{ steps.on_this_day_badge.outcome }}"
          echo "graph_minimap (P4.1):     ${{ steps.graph_minimap.outcome }}"
          echo "find_myself (P4.2):       ${{ steps.find_myself_button.outcome }}"
          echo "legend_toggle (P4.3):     ${{ steps.legend_toggle_44px.outcome }}"
          echo "keyboard_nav (P4.4):      ${{ steps.keyboard_navigation.outcome }}"
          echo "outline_view (P4.5):      ${{ steps.graph_outline_view.outcome }}"
          echo "wcag_contrast (P4.6):     ${{ steps.wcag_contrast.outcome }}"
          echo "=========================="
          # Fail the job if any suite failed
          if [ "${{ steps.edge_dedup.outcome }}" = "failure" ] || \
             [ "${{ steps.canonical.outcome }}" = "failure" ] || \
             [ "${{ steps.branch_collapse.outcome }}" = "failure" ] || \
             [ "${{ steps.couple_union.outcome }}" = "failure" ] || \
             [ "${{ steps.union_routing.outcome }}" = "failure" ] || \
             [ "${{ steps.rel_validation.outcome }}" = "failure" ] || \
             [ "${{ steps.semantic_zoom.outcome }}" = "failure" ] || \
             [ "${{ steps.lod_threshold.outcome }}" = "failure" ] || \
             [ "${{ steps.integration.outcome }}" = "failure" ] || \
             [ "${{ steps.spring_physics.outcome }}" = "failure" ] || \
             [ "${{ steps.haptic_language.outcome }}" = "failure" ] || \
             [ "${{ steps.birthday_pulse.outcome }}" = "failure" ] || \
             [ "${{ steps.memorial_candle.outcome }}" = "failure" ] || \
             [ "${{ steps.ambient_particle.outcome }}" = "failure" ] || \
             [ "${{ steps.heritage_sepia.outcome }}" = "failure" ] || \
             [ "${{ steps.on_this_day_badge.outcome }}" = "failure" ] || \
             [ "${{ steps.graph_minimap.outcome }}" = "failure" ] || \
             [ "${{ steps.find_myself_button.outcome }}" = "failure" ] || \
             [ "${{ steps.legend_toggle_44px.outcome }}" = "failure" ] || \
             [ "${{ steps.keyboard_navigation.outcome }}" = "failure" ] || \
             [ "${{ steps.graph_outline_view.outcome }}" = "failure" ] || \
             [ "${{ steps.wcag_contrast.outcome }}" = "failure" ]; then
            echo "At least one test suite failed."
            exit 1
          fi
          echo "All test suites passed!"
