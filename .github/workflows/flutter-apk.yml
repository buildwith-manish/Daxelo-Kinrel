# ─────────────────────────────────────────────────────────────────
# Build Flutter APK — triggered on push to main + manual dispatch
# ─────────────────────────────────────────────────────────────────
# Produces a debug-signed APK for testing purposes.
# For signed release builds, use build-apk-release.yml workflow.
#
# Monorepo: Flutter project is in Daxelo-Kinrel-App/
# ─────────────────────────────────────────────────────────────────

name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/**'
      - 'Daxelo-Kinrel-App/android/**'
      - 'Daxelo-Kinrel-App/pubspec.yaml'
      - 'Daxelo-Kinrel-App/pubspec.lock'
      - '.github/workflows/flutter-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java 17 (required by Android Gradle Plugin & Flutter) ────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # ── Flutter SDK (stable channel) ─────────────────────────────
      # Using channel: stable without a specific version ensures the
      # latest stable Flutter is used. The pubspec.yaml declares
      # sdk: ^3.8.0 which is compatible with recent Flutter versions.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # ── Install Android SDK & NDK ────────────────────────────────
      # Required for native builds (Drift/Sentry native libs)
      - name: Install Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ls "$ANDROID_HOME/ndk/" || echo "NDK directory not found"

      # ── Create .env file with fallback defaults ──────────────────
      # Same defaults as hardcoded in AppConfig / EnvConfig.
      # Override via GitHub Secrets if needed.
      - name: Create .env file
        run: |
          cat > Daxelo-Kinrel-App/.env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://promxswvsnvilplmrtsj.supabase.co' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb214c3d2c252aWxwbG1ydHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTcxODAsImV4cCI6MjA5NTE3MzE4MH0.70VPcCiCItKPx56cH-Y0DmcvWnrBiegmDkjv-V21taY' }}
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://daxelo-kinrel-server.onrender.com' }}
          EOF
          echo ".env file created"

      # ── Cache pub dependencies ───────────────────────────────────
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            Daxelo-Kinrel-App/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('Daxelo-Kinrel-App/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # ── Install dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: cd Daxelo-Kinrel-App && flutter pub get

      # ── Generate Drift code ──────────────────────────────────────
      # Drift requires build_runner to generate database code
      - name: Generate Drift code
        run: cd Daxelo-Kinrel-App && dart run build_runner build --delete-conflicting-outputs

      # ── Code analysis ────────────────────────────────────────────
      - name: Analyze Dart code
        run: cd Daxelo-Kinrel-App && flutter analyze --no-fatal-warnings
        continue-on-error: true

      # ── Build release APK ────────────────────────────────────────
      # Uses GitHub Actions run number as build number.
      # Without key.properties, Gradle falls back to debug signing.
      - name: Build APK
        run: cd Daxelo-Kinrel-App && flutter build apk --release --build-number=$GITHUB_RUN_NUMBER

      # ── Rename APK with build info ───────────────────────────────
      - name: Rename APK with build info
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME:-main}" | tr '/' '-')
          SRC="Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk"
          DST="Daxelo-Kinrel-App/build/app/outputs/flutter-apk/kinrel-${BRANCH}-${GITHUB_RUN_NUMBER}.apk"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "APK renamed: kinrel-${BRANCH}-${GITHUB_RUN_NUMBER}.apk"
          else
            echo "WARNING: APK not found at $SRC"
            ls -la Daxelo-Kinrel-App/build/app/outputs/flutter-apk/ || true
          fi

      # ── Upload APK artifact ──────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: warn
