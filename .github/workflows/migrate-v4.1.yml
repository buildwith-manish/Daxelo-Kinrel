# Daxelo-Kinrel v4.1 — Database Migration Workflow
# ================================================
# Runs the 4-step v4.1 migration:
#   1. prisma db push (apply schema changes — EdgeType enum, drop RelationshipPathCache, add KinshipVocabulary)
#   2. migrate-v4.1-phase-c-backfill.ts (backfill edgeType from legacy relationshipType)
#   3. migrate-v4.1-phase-d.ts (drop RelationshipPathCache table — idempotent)
#   4. import-vocabulary.ts (load 9,552-row CSV into KinshipVocabulary)
#
# TRIGGER: MANUAL ONLY (workflow_dispatch). Never runs on push — migrations
# must be intentional. The workflow is safe to re-run (all scripts idempotent).
#
# DATABASE WIRING:
#   The repo uses Neon Postgres. The connection string is stored in the
#   NEON_CONNECTION_STRING repo secret. This workflow maps it to the
#   DATABASE_URL / DIRECT_URL env vars that Prisma expects.
#
# Monitor: https://github.com/buildwith-manish/Daxelo-Kinrel/actions/workflows/migrate-v4.1.yml

name: v4.1 Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm — this modifies production data'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

concurrency:
  group: v4.1-migration
  cancel-in-progress: false    # never cancel a migration mid-flight

env:
  # Initial placeholder — overridden by the "Resolve direct Neon endpoint" step
  # below to strip "-pooler" from the hostname (GitHub Actions can't reach
  # Neon's pooler reliably).
  DATABASE_URL: ${{ format('{0}?sslmode=require&connect_timeout=30', secrets.NEON_CONNECTION_STRING) }}
  DIRECT_URL: ${{ format('{0}?sslmode=require&connect_timeout=30', secrets.NEON_CONNECTION_STRING) }}

jobs:
  migrate:
    name: Run v4.1 Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.confirm == 'yes' }}
    steps:
      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "${{ secrets.NEON_CONNECTION_STRING }}" ]; then
            echo "::error::NEON_CONNECTION_STRING secret is not set in the repo."
            echo "::error::Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✓ NEON_CONNECTION_STRING is configured"

      # ───────────────────────────────────────────────────────────────────
      # Override DATABASE_URL + DIRECT_URL for Neon + Prisma 6 compatibility.
      # Per Neon's Prisma guide: https://neon.tech/docs/guides/prisma
      #   - DATABASE_URL  = POOLED connection (with -pooler) + pgbouncer=true
      #   - DIRECT_URL    = DIRECT connection (without -pooler) for migrations
      # Both need sslmode=require. Prisma 6 db push uses DIRECT_URL.
      # ───────────────────────────────────────────────────────────────────
      - name: Resolve direct Neon endpoint
        id: resolve-db
        run: |
          ORIGINAL='${{ secrets.NEON_CONNECTION_STRING }}'
          # Determine pooled vs direct URLs
          POOLED_URL="${ORIGINAL%%\?*}?pgbouncer=true&connection_limit=1&sslmode=require&connect_timeout=30"
          # Strip -pooler for direct URL
          DIRECT_BASE="${ORIGINAL/-pooler/}"
          DIRECT_URL="${DIRECT_BASE%%\?*}?sslmode=require&connect_timeout=30"
          echo "Original host: $(echo "$ORIGINAL" | sed -n 's|.*@\([^:/?]*\).*|\1|p')"
          echo "Pooled host:   $(echo "$POOLED_URL" | sed -n 's|.*@\([^:/?]*\).*|\1|p')"
          echo "Direct host:   $(echo "$DIRECT_URL" | sed -n 's|.*@\([^:/?]*\).*|\1|p')"
          # Export to GITHUB_ENV for subsequent steps
          echo "DATABASE_URL=$POOLED_URL" >> $GITHUB_ENV
          echo "DIRECT_URL=$DIRECT_URL" >> $GITHUB_ENV
          # Use direct host for wake-up probe
          HOST=$(echo "$DIRECT_URL" | sed -n 's|.*@\([^:/?]*\).*|\1|p')
          echo "NEON_HOST=$HOST" >> $GITHUB_ENV
          echo "Resolved NEON_HOST=$HOST"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: |
          cd server
          npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      # ───────────────────────────────────────────────────────────────────
      # Wake up Neon DB (free tier auto-suspends after inactivity)
      # Neon can take up to 30s to wake from suspended state.
      # ───────────────────────────────────────────────────────────────────
      - name: "Wake up Neon database"
        run: |
          HOST="${{ env.NEON_HOST }}"
          echo "Probing Neon host: $HOST"
          for i in 1 2 3 4 5 6; do
            if nc -z -w 10 "$HOST" 5432 2>/dev/null; then
              echo "✓ Neon DB is reachable (attempt $i)"
              exit 0
            fi
            echo "  attempt $i: not yet reachable, waiting 10s..."
            sleep 10
          done
          echo "::error::Could not reach Neon DB at $HOST:5432 after 60s"
          echo "::error::The Neon project may be suspended, deleted, or the connection string is wrong."
          echo "::error::Check the Neon dashboard: https://console.neon.tech"
          exit 1

      # ───────────────────────────────────────────────────────────────────
      # Step 1: Apply schema changes (idempotent — safe to re-run)
      # Uses `db push` instead of `migrate dev` because:
      #   - We don't want to commit migration SQL files in CI
      #   - db push applies schema directly with --accept-data-loss for the
      #     RelationshipPathCache table drop (intentional, spec §1)
      # Retries 3x because Neon can drop connections on first attempt
      # ───────────────────────────────────────────────────────────────────
      - name: "[1/4] Apply schema changes (prisma db push)"
        working-directory: server
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if npx prisma db push --accept-data-loss; then
              echo "✓ db push succeeded on attempt $i"
              exit 0
            fi
            echo "  attempt $i failed, waiting 15s before retry..."
            sleep 15
          done
          echo "::error::prisma db push failed after 3 attempts"
          exit 1

      # ───────────────────────────────────────────────────────────────────
      # Step 2: Backfill edgeType from legacy relationshipType column
      # Maps father/mother/parent → PARENT, husband/wife → SPOUSE, etc.
      # ───────────────────────────────────────────────────────────────────
      - name: "[2/4] Backfill edgeType from legacy columns (Phase C)"
        working-directory: server
        run: npx ts-node scripts/migrate-v4.1-phase-c-backfill.ts

      # ───────────────────────────────────────────────────────────────────
      # Step 3: Drop deprecated RelationshipPathCache table (Phase D)
      # Idempotent — uses DROP TABLE IF EXISTS
      # ───────────────────────────────────────────────────────────────────
      - name: "[3/4] Drop RelationshipPathCache table (Phase D)"
        working-directory: server
        run: npx ts-node scripts/migrate-v4.1-phase-d.ts

      # ───────────────────────────────────────────────────────────────────
      # Step 4: Load 9,552-row vocabulary into KinshipVocabulary table
      # CSV is committed at kinrel-v3/vocabulary/daxelo_kinrel_vocabulary.csv
      # Idempotent — TRUNCATE before insert
      # ───────────────────────────────────────────────────────────────────
      - name: "[4/4] Import 9,552-row vocabulary"
        working-directory: server
        run: npx ts-node scripts/import-vocabulary.ts
        env:
          KINREL_VOCAB_CSV: ../kinrel-v3/vocabulary/daxelo_kinrel_vocabulary.csv

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  v4.1 Migration — ${{ job.status }}"
          echo "=========================================="
          echo ""
          echo "Next steps:"
          echo "  1. Verify schema: npx prisma studio (or check via psql)"
          echo "  2. Test API: curl https://your-app/v1/kinship/vocab/stats"
          echo "  3. If any step failed, check logs above and re-run (idempotent)"
