# ─────────────────────────────────────────────────────────────────
# Post-Deploy Health Check — smoke test after backend deployment
# ─────────────────────────────────────────────────────────────────
# Runs a simple HTTP health check against the production server
# to confirm the deployment is responding correctly.
#
# Triggers:
#   - After a successful push to main (server/ changes only)
#   - Manual dispatch for on-demand verification
#
# The /api/health endpoint is public (no auth required) and
# returns { status: 'ok', db, redis, uptime, memory, ts }.
# ─────────────────────────────────────────────────────────────────

name: Post-Deploy Health Check

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-health.yml'
  workflow_dispatch:
    inputs:
      health_url:
        description: 'Health check URL (override default)'
        required: false
        default: ${{ vars.HEALTH_CHECK_URL || 'https://daxelo-kinrel-server.onrender.com/api/health' }}
      max_retries:
        description: 'Max retries (1-10)'
        required: false
        default: '10'
      retry_delay:
        description: 'Seconds between retries'
        required: false
        default: '60'

concurrency:
  group: deploy-health-${{ github.ref }}
  cancel-in-progress: true

env:
  HEALTH_URL: ${{ github.event.inputs.health_url || vars.HEALTH_CHECK_URL || 'https://daxelo-kinrel-server.onrender.com/api/health' }}
  MAX_RETRIES: ${{ github.event.inputs.max_retries || '5' }}
  RETRY_DELAY: ${{ github.event.inputs.retry_delay || '30' }}

jobs:
  health-check:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Post-deploy health check
        run: |
          echo "Checking health endpoint: $HEALTH_URL"
          echo "   Max retries: $MAX_RETRIES | Retry delay: ${RETRY_DELAY}s"
          echo ""

          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_RETRIES..."

            STATUS=$(curl -s -o /tmp/health-response.json -w "%{http_code}" "$HEALTH_URL" --max-time 15)

            if [ "$STATUS" = "200" ]; then
              # Validate the JSON health status
              HEALTH_STATUS=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('/tmp/health-response.json'))
            status = d.get('data', d).get('status', 'unknown')
            db = d.get('data', d).get('db', 'unknown')
            redis = d.get('data', d).get('redis', 'unknown')
            # Redis is optional: 'ok' or 'skipped' are both healthy
            redis_ok = redis in ('ok', 'skipped')
            overall_ok = db == 'ok' and redis_ok
            print('ok' if overall_ok else 'degraded')
          except:
            print('parse_error')
          " 2>/dev/null || echo "parse_error")

              if [ "$HEALTH_STATUS" = "ok" ]; then
                echo "Health check passed: HTTP $STATUS, status: ok"
                echo ""
                echo "Response:"
                cat /tmp/health-response.json | python3 -m json.tool 2>/dev/null || cat /tmp/health-response.json
                exit 0
              elif [ "$HEALTH_STATUS" = "degraded" ]; then
                echo "Warning: Service is degraded (db or redis issue)"
                echo "Response:"
                cat /tmp/health-response.json | python3 -m json.tool 2>/dev/null || cat /tmp/health-response.json
                # Still retry - might be mid-deploy
              else
                echo "Warning: Could not parse health response"
                cat /tmp/health-response.json 2>/dev/null
              fi
            else
              echo "Warning: Received HTTP $STATUS"
            fi

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "   Retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            fi
          done

          echo ""
          echo "Health check failed after $MAX_RETRIES attempts"
          echo ""
          echo "Last response:"
          cat /tmp/health-response.json 2>/dev/null || echo "(no response body)"
          exit 1
