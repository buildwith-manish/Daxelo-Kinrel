# ─────────────────────────────────────────────────────────────────
# Batch 3 Verification Gates — authoritative CI for Batch 3
# ─────────────────────────────────────────────────────────────────
# Triggers on push to main and manual dispatch.
# Verifies all Batch 3 features (P6.1–P7.4d) via 11 parallel jobs
# + 1 final verdict job.
#
# Flutter: 3.44.2 stable (matches pubspec + existing CI)
# Java: 17 (matches Android Gradle config)
# Working directory: Daxelo-Kinrel-App
# ─────────────────────────────────────────────────────────────────

name: Batch 3 Verification Gates

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: batch-3-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'
  FLUTTER_DIR: Daxelo-Kinrel-App

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Batch 3 Static Gates (P6.1 deletion + P6.4 hardcoded strings + P7.1 honest copy)
  # ═══════════════════════════════════════════════════════════════
  batch-3-static-gates:
    name: P6.1 Deletion + P6.4 Strings + P7.1 Honest Copy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Print verified commit SHA
        run: |
          echo "Verified commit SHA: ${{ github.sha }}"
          git log --oneline -1

      # P6.1 HARD GATE: family_tree_canvas.dart deleted
      - name: P6.1 — Verify family_tree_canvas.dart is deleted
        run: |
          set -euo pipefail
          if [ -f "Daxelo-Kinrel-App/lib/features/family/presentation/family_tree_canvas.dart" ]; then
            echo "FAIL: family_tree_canvas.dart still exists"
            exit 1
          fi
          echo "PASS: family_tree_canvas.dart deleted"

      - name: P6.1 — Verify no FamilyTreeCanvas references in lib/
        run: |
          set -euo pipefail
          COUNT=$(grep -r "FamilyTreeCanvas" Daxelo-Kinrel-App/lib/ --include="*.dart" | grep -v "^.*://" | wc -l || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "FAIL: Found $COUNT references to FamilyTreeCanvas in lib/"
            grep -r "FamilyTreeCanvas" Daxelo-Kinrel-App/lib/ --include="*.dart" | grep -v "^.*://"
            exit 1
          fi
          echo "PASS: No FamilyTreeCanvas references in lib/"

      # P6.4 HARD GATE: hardcoded strings check
      - name: P6.4 — Hardcoded strings check
        run: |
          set -euo pipefail
          bash scripts/check_hardcoded_strings.sh

      # P7.1 HARD GATE: no AI-written claim
      - name: P7.1 — Verify no AI-written claim
        run: |
          set -euo pipefail
          COUNT=$(grep -r "AI-written" Daxelo-Kinrel-App/lib/ server/src/ --include="*.dart" --include="*.ts" 2>/dev/null | wc -l || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "FAIL: Found $COUNT 'AI-written' references"
            grep -r "AI-written" Daxelo-Kinrel-App/lib/ server/src/ --include="*.dart" --include="*.ts"
            exit 1
          fi
          echo "PASS: No AI-written claims"

      # Copy audit
      - name: Copy audit
        run: |
          set -euo pipefail
          bash scripts/check_copy_audit.sh

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Family Space Integration Tests (P6.1 + P6.2 + P6.3)
  # ═══════════════════════════════════════════════════════════════
  family-space-integration-tests:
    name: P6.1 + P6.2 + P6.3 Family Space Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: P6.1 — Family tree canvas deletion tests
        run: flutter test test/features/family/p6_1_family_tree_canvas_deletion_test.dart --reporter expanded

      - name: P6.2 — Trackc theme tests
        run: flutter test test/features/trackc/p6_2_trackc_theme_test.dart --reporter expanded

      - name: P6.3 — Decision create routing tests
        run: flutter test test/core/routing/p6_3_decision_create_routing_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Localization Hard Gate (P6.4)
  # ═══════════════════════════════════════════════════════════════
  localization-hard-gate:
    name: P6.4 Localization Hard Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: P6.4 — Hardcoded strings test
        run: flutter test test/p6_4_hardcoded_strings_test.dart --reporter expanded

      - name: P6.4 — Localization generation
        run: flutter gen-l10n

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Cross-Feature Search Tests (P6.5)
  # ═══════════════════════════════════════════════════════════════
  cross-feature-search-tests:
    name: P6.5 Cross-Feature Search Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: P6.5 — Cross-feature search tests
        run: flutter test test/features/search/cross_feature_search_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Story Mode Tests (P7.2)
  # ═══════════════════════════════════════════════════════════════
  story-mode-tests:
    name: P7.2 Story Mode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: P7.2 — Story Mode tests
        run: flutter test test/features/story_mode/story_mode_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 6: Family Journey Tests (P7.3)
  # ═══════════════════════════════════════════════════════════════
  family-journey-tests:
    name: P7.3 Family Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: P7.3 — Family Journey tests
        run: flutter test test/features/family_journey/journey_provider_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 7: Family Preservation Feature Tests (P7.1 + P7.4a-d)
  # ═══════════════════════════════════════════════════════════════
  family-preservation-feature-tests:
    name: P7.1 + P7.4a-d Preservation Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: P7.1 — Chronicle honest copy tests
        run: flutter test test/features/pulse/p7_1_chronicle_honest_copy_test.dart --reporter expanded

      - name: P7.4a — Story Threads tests
        run: flutter test test/features/story_threads/story_threads_test.dart --reporter expanded

      - name: P7.4b — Voice Memo tests
        run: flutter test test/features/voice_memos/voice_memo_test.dart --reporter expanded

      - name: P7.4c — Generational Interviews tests
        run: flutter test test/features/generational_interviews/interview_prompts_test.dart --reporter expanded

      - name: P7.4d — Unified Timeline tests
        run: flutter test test/features/unified_timeline/unified_timeline_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 8: Flutter Analyze
  # ═══════════════════════════════════════════════════════════════
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 9: Broader Flutter Tests
  # ═══════════════════════════════════════════════════════════════
  flutter-tests:
    name: Broader Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run edge dedup tests
        run: flutter test test/graph/engine/edge_dedup_test.dart --reporter expanded
        continue-on-error: true

      - name: Run branch collapse state tests
        run: flutter test test/graph/interaction/branch_collapse_state_test.dart --reporter expanded
        continue-on-error: true

      - name: Run relationship validation tests
        run: flutter test test/graph/interaction/relationship_validation_test.dart --reporter expanded
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 10: Android Release Build
  # ═══════════════════════════════════════════════════════════════
  android-release-build:
    name: Android Release APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Setup Android SDK (NDK + CMake)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.1" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ls "$ANDROID_HOME/ndk/" || echo "NDK directory not found"
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --build-number=$GITHUB_RUN_NUMBER

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "FAIL: APK not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "PASS: APK built successfully ($APK_SIZE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-3-release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════
  # Job 11: Final Verdict
  # ═══════════════════════════════════════════════════════════════
  batch-3-verdict:
    name: Batch 3 Final Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - batch-3-static-gates
      - family-space-integration-tests
      - localization-hard-gate
      - cross-feature-search-tests
      - story-mode-tests
      - family-journey-tests
      - family-preservation-feature-tests
      - flutter-analyze
      - flutter-tests
      - android-release-build
    steps:
      - name: Print verified commit SHA
        run: |
          echo "=== Batch 3 Final Verdict ==="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Evaluate all required jobs
        run: |
          echo "=== Required Job Results ==="
          echo "batch-3-static-gates:              ${{ needs.batch-3-static-gates.result }}"
          echo "family-space-integration-tests:    ${{ needs.family-space-integration-tests.result }}"
          echo "localization-hard-gate:            ${{ needs.localization-hard-gate.result }}"
          echo "cross-feature-search-tests:        ${{ needs.cross-feature-search-tests.result }}"
          echo "story-mode-tests:                  ${{ needs.story-mode-tests.result }}"
          echo "family-journey-tests:              ${{ needs.family-journey-tests.result }}"
          echo "family-preservation-feature-tests:  ${{ needs.family-preservation-feature-tests.result }}"
          echo "flutter-analyze:                   ${{ needs.flutter-analyze.result }}"
          echo "flutter-tests:                     ${{ needs.flutter-tests.result }}"
          echo "android-release-build:             ${{ needs.android-release-build.result }}"
          echo "=============================="

          if [ "${{ needs.batch-3-static-gates.result }}" != "success" ] || \
             [ "${{ needs.family-space-integration-tests.result }}" != "success" ] || \
             [ "${{ needs.localization-hard-gate.result }}" != "success" ] || \
             [ "${{ needs.cross-feature-search-tests.result }}" != "success" ] || \
             [ "${{ needs.story-mode-tests.result }}" != "success" ] || \
             [ "${{ needs.family-journey-tests.result }}" != "success" ] || \
             [ "${{ needs.family-preservation-feature-tests.result }}" != "success" ] || \
             [ "${{ needs.flutter-tests.result }}" != "success" ] || \
             [ "${{ needs.android-release-build.result }}" != "success" ]; then
            echo ""
            echo "BATCH 3 AUTOMATED VERIFICATION FAILED ❌"
            exit 1
          fi

          echo ""
          echo "BATCH 3 AUTOMATED GATES VERIFIED ✅"
          echo ""
          echo "P6.1 family_tree_canvas.dart DELETION: PASS"
          echo "P6.4 LOCALIZATION HARD GATE: PASS"
          echo "P7.1 HONEST COPY: PASS"
          echo ""
          echo "MANUAL GATES REMAIN:"
          echo "  - P6.1 Family Space 2-tap reachability on device"
          echo "  - P6.2 Trackc dark theme visual review"
          echo "  - P6.4 Multi-language review"
          echo "  - P6.5 Cross-feature search with real data"
          echo "  - P7.1 Chronicle trust copy review"
          echo "  - P7.2 Story Mode end-to-end on device"
          echo "  - P7.3 Journey scrubber on device"
          echo "  - P7.4b Voice memo on real hardware"
          echo "  - P7.4c Interview completion on device"
          echo "  - P7.4d Timeline with realistic data"
          echo "  - Accessibility + reduced-motion review"
