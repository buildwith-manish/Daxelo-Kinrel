name: Upload Kinship Matrix to Neon

# Manually triggered OR auto-triggered when upload script changes.
# Designed to be re-run repeatedly: each run resumes from the committed checkpoint
# until the full 28,761,769 rows are uploaded to Neon PostgreSQL.
#
# Workflow:
#   1. Checkout repo (includes scripts/ + Daxelo-Kinrel-App/assets/data/indian_kinship.json)
#   2. Install psycopg2-binary
#   3. Generate kinship_matrix.csv from indian_kinship.json (~2 minutes)
#   4. Read checkpoint from scripts/neon_checkpoint.json
#   5. Upload to Neon with ON CONFLICT DO NOTHING (idempotent, safe to re-run)
#   6. Verify upload with sample queries
#   7. Auto-commit updated checkpoint back to repo
on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset checkpoint and start from row 0 (use only if you want to re-upload)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
    paths:
      - 'scripts/upload_to_neon.py'
      - '.github/workflows/neon_upload.yml'

concurrency:
  group: neon-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub Actions hard limit is 6 hours (360 min); leave 10 min buffer

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # No cache: 'pip' — this repo has no requirements.txt/pyproject.toml.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary

    - name: Verify source JSON exists
      run: |
        if [ ! -f Daxelo-Kinrel-App/assets/data/indian_kinship.json ]; then
          echo "ERROR: Daxelo-Kinrel-App/assets/data/indian_kinship.json not found"
          echo "Checked: $(pwd)/Daxelo-Kinrel-App/assets/data/indian_kinship.json"
          ls -la
          exit 1
        fi
        SIZE=$(stat -c%s Daxelo-Kinrel-App/assets/data/indian_kinship.json)
        SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
        echo "Source JSON: ${SIZE_MB} MB"

    - name: Show starting checkpoint
      run: |
        echo "=== Repo checkpoint (committed from previous run) ==="
        if [ -f scripts/neon_checkpoint.json ]; then
          cat scripts/neon_checkpoint.json
        else
          echo "No committed checkpoint — will start from row 0"
        fi

    - name: Optionally reset checkpoint
      if: ${{ github.event.inputs.reset == 'true' }}
      run: |
        echo "Reset requested — deleting checkpoint files"
        rm -f scripts/neon_checkpoint.json neon_checkpoint.json
        echo "NOTE: existing Neon data is NOT cleared. Re-running will use ON CONFLICT DO NOTHING to skip duplicates."

    - name: Generate kinship_matrix.csv from JSON
      run: |
        echo "Generating CSV from Daxelo-Kinrel-App/assets/data/indian_kinship.json..."
        python scripts/generate_kinship_matrix.py \
          Daxelo-Kinrel-App/assets/data/indian_kinship.json \
          kinship_matrix.csv
        echo ""
        echo "=== CSV generated ==="
        ls -lh kinship_matrix.csv
        echo ""
        echo "Row count (incl header):"
        wc -l kinship_matrix.csv

    - name: Resume upload from checkpoint
      env:
        NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      run: |
        if [ -z "$NEON_CONNECTION_STRING" ]; then
          echo "ERROR: NEON_CONNECTION_STRING secret must be set."
          echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
          echo "  NEON_CONNECTION_STRING = postgresql://user:pass@host/db?sslmode=require"
          exit 1
        fi
        echo "Starting upload (timeout: 340 min)..."
        timeout 340m python scripts/upload_to_neon.py kinship_matrix.csv || true
        echo ""
        echo "=== Upload phase complete (either finished or timed out) ==="
        echo "Final checkpoint:"
        cat scripts/neon_checkpoint.json 2>/dev/null || echo "No checkpoint written"

    - name: Verify upload
      env:
        NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      run: |
        echo "=== Running verification queries ==="
        python scripts/upload_to_neon.py --verify-only || true

    - name: Commit updated checkpoint back to repo
      if: always()
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: |
          chore(neon): upload checkpoint at row ${{ steps.checkpoint_row.outputs.row }}

          Auto-committed by GitHub Actions workflow: neon_upload.yml
          Run: ${{ github.run_id }}
        file_pattern: 'scripts/neon_checkpoint.json'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
