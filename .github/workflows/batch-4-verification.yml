# ─────────────────────────────────────────────────────────────────
# Batch 4 Final Verification Gates — authoritative CI for Batch 4
# and FINAL cross-batch release gate audit.
# ─────────────────────────────────────────────────────────────────
# Triggers on push to main and manual dispatch.
# Verifies all Batch 4 features (P8.1–P9.2k) + re-runs all cross-batch
# hard gates (Batches 1–4) on current main HEAD.
#
# Flutter: 3.44.2 stable
# Java: 17
# Working directory: Daxelo-Kinrel-App
# ─────────────────────────────────────────────────────────────────

name: Batch 4 Final Verification Gates

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: batch-4-final-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Batch 4 Static Gates
  # ═══════════════════════════════════════════════════════════════
  batch-4-static-gates:
    name: Batch 4 Static Gates (Kinship + Copy + Ethics)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print verified commit SHA
        run: echo "Verified commit SHA: ${{ github.sha }}"

      # P8.1 HARD GATE: kinship languages >= 9
      - name: P8.1 — Kinship language count >= 9
        run: |
          set -euo pipefail
          cd Daxelo-Kinrel-App
          python3 scripts/count_kinship_languages.py

      # P6.4 HARD GATE: hardcoded strings
      - name: P6.4 — Hardcoded strings check
        run: bash scripts/check_hardcoded_strings.sh

      # P7.1 HARD GATE: no AI-written
      - name: P7.1 — No AI-written claim
        run: |
          set -euo pipefail
          COUNT=$(grep -r "AI-written" Daxelo-Kinrel-App/lib/ server/src/ --include="*.dart" --include="*.ts" 2>/dev/null | wc -l || echo "0")
          if [ "$COUNT" -gt 0 ]; then exit 1; fi

      # Copy audit
      - name: Copy audit
        run: bash scripts/check_copy_audit.sh

      # P6.1 HARD GATE: family_tree_canvas deleted
      - name: P6.1 — family_tree_canvas.dart deleted
        run: |
          set -euo pipefail
          if [ -f "Daxelo-Kinrel-App/lib/features/family/presentation/family_tree_canvas.dart" ]; then exit 1; fi
          COUNT=$(grep -r "FamilyTreeCanvas" Daxelo-Kinrel-App/lib/ --include="*.dart" | grep -v "^.*://" | wc -l || echo "0")
          if [ "$COUNT" -gt 0 ]; then exit 1; fi

      # HARD GATE 5: no engagement metrics
      - name: No engagement metrics
        run: |
          set -euo pipefail
          COUNT=$(grep -r "daily_active\|monthly_active\|session_count\|engagement_score" Daxelo-Kinrel-App/lib/ server/src/ --include="*.dart" --include="*.ts" 2>/dev/null | wc -l || echo "0")
          if [ "$COUNT" -gt 0 ]; then exit 1; fi

      # Ethical reset (Batch 1)
      - name: Ethical reset — no addictively
        run: |
          set -euo pipefail
          COUNT=$(grep -r "addictively\|emotionally devastating" server/src/ --include="*.ts" --exclude-dir=__tests__ 2>/dev/null | wc -l || echo "0")
          if [ "$COUNT" -gt 0 ]; then exit 1; fi

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Global Kinship + Localization + RTL Tests
  # ═══════════════════════════════════════════════════════════════
  global-kinship-dataset-tests:
    name: P8.1 Kinship + P8.2a RTL + P6.4 L10n Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: P8.1 — Kinship expansion tests
        run: flutter test test/core/kinship/p8_1_kinship_expansion_test.dart --reporter expanded
      - name: P8.2a — RTL check tests
        run: flutter test test/features/rtl/ --reporter expanded
      - name: P6.4 — Localization generation
        run: flutter gen-l10n
      - name: P6.4 — Hardcoded strings test
        run: flutter test test/p6_4_hardcoded_strings_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Festival + Translation + Trivia Tests
  # ═══════════════════════════════════════════════════════════════
  festival-global-readiness-tests:
    name: P8.2b Festival + P8.2c Translation + P9.1 Trivia Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: P8.2b — Festival theme tests
        run: flutter test test/features/festival_theme/ --reporter expanded
      - name: P8.2c — Translation tests
        run: flutter test test/features/translation/ --reporter expanded
      - name: P9.1 — Trivia tests
        run: flutter test test/features/trivia/ --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Phase 9 Feature Tests (P9.2a-P9.2k)
  # ═══════════════════════════════════════════════════════════════
  phase-9-feature-tests:
    name: P9.2a-k Phase 9 Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: P9.2a — Gratitude jar tests
        run: flutter test test/features/gratitude_jar/ --reporter expanded
      - name: P9.2b — Family values tests
        run: flutter test test/features/family_values/ --reporter expanded
      - name: P9.2c — Kinship pronunciation tests
        run: flutter test test/features/kinship_pronunciation/ --reporter expanded
      - name: P9.2d — Guest access tests
        run: flutter test test/features/guest_access/ --reporter expanded
      - name: P9.2e — Home widget tests
        run: flutter test test/features/home_widgets/ --reporter expanded
      - name: P9.2f — Shared albums tests
        run: flutter test test/features/shared_albums/ --reporter expanded
      - name: P9.2g — Relationship flags tests
        run: flutter test test/features/relationship_flags/ --reporter expanded
      - name: P9.2h — Ambient orbit tests
        run: flutter test test/features/ambient_orbit/ --reporter expanded
      - name: P9.2k — Ancestor tribute tests
        run: flutter test test/features/ancestor_tribute/ --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Cross-Batch Hard Gates (Batch 2 correctness + accessibility)
  # ═══════════════════════════════════════════════════════════════
  final-cross-batch-release-gates:
    name: Cross-Batch Release Gates (P5.2 + P4.x + P3.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: HARD GATE 2 — P5.2 Kinship correctness suite
        run: flutter test test/graph/correctness/kinship_correctness_test.dart --reporter expanded
      - name: HARD GATE 2 — P5.2 Path correctness suite
        run: flutter test test/graph/correctness/path_correctness_test.dart --reporter expanded
      - name: P4.x — Accessibility tests
        run: flutter test test/graph/accessibility/reduced_motion_test.dart --reporter expanded
      - name: P3.x — Emotional layer tests
        run: flutter test test/graph/interaction/spring_physics_test.dart test/graph/interaction/haptic_language_test.dart --reporter expanded
      - name: P6.x — Family space tests
        run: flutter test test/features/family/p6_1_family_tree_canvas_deletion_test.dart test/features/trackc/p6_2_trackc_theme_test.dart --reporter expanded
      - name: P7.x — Story mode + journey tests
        run: flutter test test/features/story_mode/story_mode_test.dart test/features/family_journey/journey_provider_test.dart --reporter expanded

  # ═══════════════════════════════════════════════════════════════
  # Job 6: Flutter Analyze
  # ═══════════════════════════════════════════════════════════════
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Job 7: Android Release Build
  # ═══════════════════════════════════════════════════════════════
  android-release-build:
    name: Android Release APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - name: Setup Android SDK (NDK + CMake)
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.1" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        working-directory: ${{ github.workspace }}
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release APK
        run: flutter build apk --release --build-number=$GITHUB_RUN_NUMBER
      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then exit 1; fi
          echo "PASS: APK built successfully"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-4-final-release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════
  # Job 8: Final Verdict
  # ═══════════════════════════════════════════════════════════════
  batch-4-final-verdict:
    name: Batch 4 Final Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - batch-4-static-gates
      - global-kinship-dataset-tests
      - festival-global-readiness-tests
      - phase-9-feature-tests
      - final-cross-batch-release-gates
      - flutter-analyze
      - android-release-build
    steps:
      - name: Print verified commit SHA
        run: |
          echo "=== Batch 4 Final Verdict ==="
          echo "Commit SHA: ${{ github.sha }}"
      - name: Evaluate all required jobs
        run: |
          echo "=== Required Job Results ==="
          echo "batch-4-static-gates:              ${{ needs.batch-4-static-gates.result }}"
          echo "global-kinship-dataset-tests:      ${{ needs.global-kinship-dataset-tests.result }}"
          echo "festival-global-readiness-tests:   ${{ needs.festival-global-readiness-tests.result }}"
          echo "phase-9-feature-tests:             ${{ needs.phase-9-feature-tests.result }}"
          echo "final-cross-batch-release-gates:   ${{ needs.final-cross-batch-release-gates.result }}"
          echo "flutter-analyze:                   ${{ needs.flutter-analyze.result }}"
          echo "android-release-build:             ${{ needs.android-release-build.result }}"
          echo "=============================="
          if [ "${{ needs.batch-4-static-gates.result }}" != "success" ] || \
             [ "${{ needs.global-kinship-dataset-tests.result }}" != "success" ] || \
             [ "${{ needs.festival-global-readiness-tests.result }}" != "success" ] || \
             [ "${{ needs.phase-9-feature-tests.result }}" != "success" ] || \
             [ "${{ needs.final-cross-batch-release-gates.result }}" != "success" ] || \
             [ "${{ needs.android-release-build.result }}" != "success" ]; then
            echo ""
            echo "BATCH 4 AUTOMATED VERIFICATION FAILED ❌"
            exit 1
          fi
          echo ""
          echo "ALL FOUR BATCH AUTOMATED RELEASE GATES VERIFIED ✅"
          echo ""
          echo "Cross-batch hard gates:"
          echo "  HARD GATE 1 — Ethical Reset: PASS"
          echo "  HARD GATE 2 — P5.2 Kinship Correctness: PASS"
          echo "  P6.1 — family_tree_canvas.dart deleted: PASS"
          echo "  P6.4 — Localization hard gate: PASS"
          echo "  P7.1 — Honest copy (no AI-written): PASS"
          echo "  P8.1 — Kinship languages >= 9: PASS (22 languages)"
          echo "  HARD GATE 5 — No engagement metrics: PASS"
          echo ""
          echo "MANUAL RELEASE SIGN-OFF REMAINS REQUIRED"
