# ─────────────────────────────────────────────────────────────────
# Daxelo Kinrel — Unified CI Pipeline
# ─────────────────────────────────────────────────────────────────
# Runs on every push / PR to main.
# Jobs: Flutter analyze, Flutter test, Backend CI, Android APK build.
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Flutter Analyze
  # ═══════════════════════════════════════════════════════════════
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        # v5.183: Changed from --no-fatal-warnings to just --no-fatal-infos.
        # Warnings (unused imports, type mismatches, missing required params)
        # now FAIL the build. Info-level lints (prefer_single_quotes, etc.)
        # remain non-blocking to avoid noise from style-only issues.
        # This catches the kind of bugs that were shipping to production:
        # wrong import paths, missing flutter_riverpod imports, etc.

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Flutter Test
  # ═══════════════════════════════════════════════════════════════
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── QA hardening 2026-09-20 ────────────────────────────────────
      # The app no longer carries hardcoded Supabase fallbacks — the
      # keys are env-only and FAIL LOUDLY when missing. Inject them via
      # --dart-define from repo secrets so the tests exercise the real
      # resolution path, and fail the job up front when the secrets are
      # absent instead of letting tests hit opaque StateErrors.
      - name: Verify Supabase config secrets (fail loudly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::(Values: Supabase Dashboard → Settings → API — use the publishable/anon key.)"
            exit 1
          fi

      - name: Run Flutter tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter test --no-pub
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Backend CI
  # ═══════════════════════════════════════════════════════════════
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck (backend)
        # QA fix 2026-09-19: `bun run lint` has failed with "Script not found"
        # ever since the lint script was removed from server/package.json —
        # there is no eslint setup in the repo. Replace the dead step with a
        # REAL gate: TypeScript typecheck of the NestJS server (verified
        # passing locally). NOTE: this job's defaults.run.working-directory
        # is already `server` — do NOT `cd server` here.
        run: npm install --legacy-peer-deps --no-audit --no-fund && npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        run: bun run build

      - name: Test
        # QA fix 2026-09-19: was `bun test` — bun's built-in runner, which
        # IGNORES jest.config.js (no moduleNameMapper → the @prisma/client
        # mock never loads → real PrismaClient + env-dependent failures).
        # This step had NEVER executed before (the dead lint step above
        # always failed first), so the mismatch went unnoticed. The project's
        # test runner is jest (package.json "test": "jest" + jest.config.js);
        # node_modules is already npm-installed by the typecheck step above.
        # --forceExit: NestJS services keep background timers alive after the
        # run (open handles), which would hang the job until timeout.
        run: npx jest --ci --forceExit

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Android APK Build
  # ═══════════════════════════════════════════════════════════════
  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [flutter-analyze, flutter-test]
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK & NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.1" \
            "platforms;android-33" "build-tools;33.0.0" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── QA hardening 2026-09-20 ────────────────────────────────────
      # Replaced the old "Create .env file" step: that file was never
      # bundled (.env is not a pubspec asset), so the build silently ran
      # on the hardcoded fallbacks AppConfig used to carry. Those are
      # gone — the keys are injected at compile time via --dart-define,
      # and the build fails loudly when the secrets are missing.
      - name: Verify Supabase config secrets (fail loudly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --release --build-number=$GITHUB_RUN_NUMBER
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: warn
