# ─────────────────────────────────────────────────────────────────
# Daxelo Kinrel — Unified CI Pipeline
# ─────────────────────────────────────────────────────────────────
# Runs on every push / PR to main.
# Jobs: Flutter analyze, Flutter test, Backend CI, Android APK build.
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Flutter Analyze
  # ═══════════════════════════════════════════════════════════════
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Flutter Test
  # ═══════════════════════════════════════════════════════════════
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter tests
        run: flutter test --no-pub

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Backend CI
  # ═══════════════════════════════════════════════════════════════
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Android APK Build
  # ═══════════════════════════════════════════════════════════════
  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [flutter-analyze, flutter-test]
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK & NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.1" \
            "platforms;android-33" "build-tools;33.0.0" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://promxswvsnvilplmrtsj.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb214c3d2c252aWxwbG1ydHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTcxODAsImV4cCI6MjA5NTE3MzE4MH0.70VPcCiCItKPx56cH-Y0DmcvWnrBiegmDkjv-V21taY
          API_BASE_URL=https://daxelo-kinrel-server.onrender.com
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release --build-number=$GITHUB_RUN_NUMBER

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: warn
