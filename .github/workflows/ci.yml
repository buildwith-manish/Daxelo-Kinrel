# ─────────────────────────────────────────────────────────────────
# Daxelo Kinrel — Unified CI Pipeline
# ─────────────────────────────────────────────────────────────────
# Runs on every push / PR to main, the repo's default branch
# (feature-registry) + the active phase/feature/fix branches.
# Jobs: detect-changes (path gating), Flutter analyze, Flutter test (fast +
# native_maps), Backend CI, Android APK build. Secret scan always runs.
#
# `Flutter Analyze` is the gate that would have caught the v5.191 compile
# errors (a Map subscript on a typed class) before the Vercel web build broke:
# any analyzer ERROR or WARNING fails the job; info-level lints do not.
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - feature-registry  # the repo's default branch (there is no `main` yet)
      - graph-layout
      - sparq
      - 'phase-**'      # phase-a/home-kinship-ring, phase-b/todays-question-voice, etc.
      - 'wip/**'        # wip/phase-a-decisions, etc.
      - 'feat/**'       # feat/family-sparq-tray, feat/settings-redesign, etc.
      - 'fix/**'        # fix/1a ... task branches: analyze/test must run BEFORE merge
  pull_request:
    branches:
      - main
      - feature-registry
      - graph-layout
      - sparq
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job -1: Detect changes (path-based gating)
  # ═══════════════════════════════════════════════════════════════
  # Flutter jobs run only when Daxelo-Kinrel-App/** changed; Backend CI only
  # when server/** changed. On push the filter diffs against the commit
  # before the push (base = the pushed branch itself); on pull_request it
  # diffs against the PR base (the `base` input is ignored there).
  # workflow_dispatch always runs everything. Secret scan is NOT gated.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.flutter == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          filters: |
            flutter:
              - 'Daxelo-Kinrel-App/**'
            backend:
              - 'server/**'

  # ═══════════════════════════════════════════════════════════════
  # Job 0: Secret Scanning (gitleaks) — Phase 1 Security
  # ═══════════════════════════════════════════════════════════════
  # Fails the CI run if any secret (Supabase service_role JWT, Turso
  # token, DB password, API key) is found in the codebase. This is a
  # defense-in-depth measure: even if a developer accidentally commits
  # a secret, this job catches it before merge.
  #
  # The old hardcoded secrets were removed in Phase 1 (commit message
  # "perf(phase1): security — remove hardcoded secrets"), but gitleaks
  # also scans the FULL git history for the diff of each commit — so
  # if the old secrets are still in history (before the purge), this
  # job WILL fail until the owner purges them (see
  # docs/security/ROTATE_KEYS.md).
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for leak scanning

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Optional: set GITHUB_TOKEN to enable PR comments on leaks.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set GITLEAKS_LICENSE for the hosted version with
          # custom rules. The free OSS version is sufficient for
          # detecting hardcoded JWTs, API keys, and connection strings.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ═══════════════════════════════════════════════════════════════
  # Job 1: Flutter Analyze
  # ═══════════════════════════════════════════════════════════════
  flutter-analyze:
    name: Flutter Analyze
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++abi-19-dev libunwind-19-dev

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Cache pub resolution
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.pub-cache
            Daxelo-Kinrel-App/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('Daxelo-Kinrel-App/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        # `shell: bash` = `bash -eo pipefail`, so piping through `tee` below
        # still propagates flutter analyze's exit code. Do NOT add
        # `continue-on-error` or `|| true` to this step: it must stay blocking.
        shell: bash
        run: flutter analyze --fatal-warnings --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.txt"
        # Flags are explicit on purpose (they match flutter's defaults, minus
        # infos): ERRORS and WARNINGS exit non-zero and fail the job; infos
        # (prefer_single_quotes, etc.) stay non-blocking to avoid style noise.
        # v5.183 moved from --no-fatal-warnings to this; v5.191 showed why it
        # matters (wrong member access on a typed class shipped to a Vercel
        # build because nothing ran the analyzer).

      - name: Surface analyzer errors and warnings
        # Runs only when the analyze step failed. Re-emits each error/warning
        # line as a workflow annotation + job summary so the cause is visible
        # without opening the raw log. Cannot change the job result (the job
        # is already failed by the step above).
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/analyze.txt"
          [ -f "$f" ] || exit 0
          {
            echo '### flutter analyze: errors and warnings'
            echo '```'
            grep -E '^\s*(error|warning) •' "$f" | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*(error|warning) •' "$f" | head -50 | while IFS= read -r line; do
            echo "::error title=flutter analyze::${line}"
          done

  # ═══════════════════════════════════════════════════════════════
  # Job 2a: Flutter Test (fast) — no native toolchain
  # ═══════════════════════════════════════════════════════════════
  # Plain Dart/widget tests. No apt install, no native-assets config.
  # build_runner stays (out of scope to remove: the generated files it
  # produces are gitignored; see docs/fix-progress.md follow-up).
  flutter-test-fast:
    name: Flutter Test (fast)
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub resolution
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.pub-cache
            Daxelo-Kinrel-App/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('Daxelo-Kinrel-App/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── QA hardening 2026-09-20 ────────────────────────────────────
      # The app no longer carries hardcoded Supabase fallbacks — the
      # keys are env-only and FAIL LOUDLY when missing. Inject them via
      # --dart-define from repo secrets so the tests exercise the real
      # resolution path, and fail the job up front when the secrets are
      # absent instead of letting tests hit opaque StateErrors.
      - name: Verify Supabase config secrets (fail loudly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::(Values: Supabase Dashboard → Settings → API — use the publishable/anon key.)"
            exit 1
          fi

      - name: Run Flutter tests (everything except native_maps)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: >-
          flutter test --no-pub --exclude-tags=native_maps
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          2>&1 | tee "$RUNNER_TEMP/test.txt"

      - name: Surface test failures
        # Runs only when the test step failed; re-emits failing-test / load-error
        # lines as annotations so the cause is visible without the raw log.
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/test.txt"
          [ -f "$f" ] || exit 0
          grep -E '\[E\]|Some tests failed|Failed to load|Error: |error •|Could not|native' "$f" | head -40 | while IFS= read -r line; do
            echo "::error title=flutter test::${line:0:400}"
          done

  # ═══════════════════════════════════════════════════════════════
  # Job 2b: Flutter Test (native_maps) — perf + golden family_map tests
  # ═══════════════════════════════════════════════════════════════
  # Files tagged @Tags(['native_maps']) (test/features/family_map/{perf,golden}).
  flutter-test-native:
    name: Flutter Test (native_maps)
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++abi-19-dev libunwind-19-dev

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Cache pub resolution
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.pub-cache
            Daxelo-Kinrel-App/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('Daxelo-Kinrel-App/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── QA hardening 2026-09-20 ────────────────────────────────────
      # The app no longer carries hardcoded Supabase fallbacks — the
      # keys are env-only and FAIL LOUDLY when missing. Inject them via
      # --dart-define from repo secrets so the tests exercise the real
      # resolution path, and fail the job up front when the secrets are
      # absent instead of letting tests hit opaque StateErrors.
      - name: Verify Supabase config secrets (fail loudly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::(Values: Supabase Dashboard → Settings → API — use the publishable/anon key.)"
            exit 1
          fi

      - name: Run Flutter tests (native_maps only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: >-
          flutter test --no-pub --tags=native_maps
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          2>&1 | tee "$RUNNER_TEMP/test.txt"

      - name: Surface test failures
        # Runs only when the test step failed; re-emits failing-test / load-error
        # lines as annotations so the cause is visible without the raw log.
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/test.txt"
          [ -f "$f" ] || exit 0
          grep -E '\[E\]|Some tests failed|Failed to load|Error: |error •|Could not|native' "$f" | head -40 | while IFS= read -r line; do
            echo "::error title=flutter test::${line:0:400}"
          done

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Backend CI
  # ═══════════════════════════════════════════════════════════════
  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck (backend)
        # QA fix 2026-09-19: `bun run lint` has failed with "Script not found"
        # ever since the lint script was removed from server/package.json —
        # there is no eslint setup in the repo. Replace the dead step with a
        # REAL gate: TypeScript typecheck of the NestJS server (verified
        # passing locally). NOTE: this job's defaults.run.working-directory
        # is already `server` — do NOT `cd server` here.
        run: npm install --legacy-peer-deps --no-audit --no-fund && npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        run: bun run build

      - name: Test
        # QA fix 2026-09-19: was `bun test` — bun's built-in runner, which
        # IGNORES jest.config.js (no moduleNameMapper → the @prisma/client
        # mock never loads → real PrismaClient + env-dependent failures).
        # This step had NEVER executed before (the dead lint step above
        # always failed first), so the mismatch went unnoticed. The project's
        # test runner is jest (package.json "test": "jest" + jest.config.js);
        # node_modules is already npm-installed by the typecheck step above.
        # --forceExit: NestJS services keep background timers alive after the
        # run (open handles), which would hang the job until timeout.
        run: npx jest --ci --forceExit

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Android APK Build
  # ═══════════════════════════════════════════════════════════════
  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [flutter-analyze, flutter-test-fast, flutter-test-native]
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK & NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.1" \
            "platforms;android-33" "build-tools;33.0.0" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── QA hardening 2026-09-20 ────────────────────────────────────
      # Replaced the old "Create .env file" step: that file was never
      # bundled (.env is not a pubspec asset), so the build silently ran
      # on the hardcoded fallbacks AppConfig used to carry. Those are
      # gone — the keys are injected at compile time via --dart-define,
      # and the build fails loudly when the secrets are missing.
      - name: Verify Supabase config secrets (fail loudly)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY secrets are missing."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++abi-19-dev libunwind-19-dev

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --release --build-number=$GITHUB_RUN_NUMBER
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: warn
