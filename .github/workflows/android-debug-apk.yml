# ─────────────────────────────────────────────────────────────────
# Daxelo Kinrel — Android Debug APK Build (Standalone)
# ─────────────────────────────────────────────────────────────────
# Builds a DEBUG APK (not release — no signing required) so the APK
# can be built even when the Supabase secrets aren't needed for a
# signed release.  Runs independently of the main ci.yml pipeline
# (does NOT depend on flutter-analyze / flutter-test passing).
#
# Triggers:
#   - workflow_dispatch (manual, from the Actions tab)
#   - push to feature branches (not main — avoids duplicating ci.yml)
#
# Artifact: app-debug.apk (14-day retention)
#
# Why a separate workflow?
#   The existing ci.yml `android-build` job builds a RELEASE APK and
#   is gated on flutter-analyze + flutter-test passing (both currently
#   failing on main due to pre-existing analyzer errors).  This
#   standalone workflow builds a DEBUG APK WITHOUT the analyze/test
#   gate so the APK is always available for download — even while
#   the main CI pipeline is being fixed.
#
# Compatibility:
#   Flutter  3.44.2  (matches pubspec.yaml sdk: ^3.12.0 + ci.yml env)
#   Java     17      (Zulu — matches app/build.gradle.kts VERSION_17)
#   Kotlin   2.2.20  (from settings.gradle.kts)
#   AGP      8.9.2   (from settings.gradle.kts)
#   compileSdk 36    (from app/build.gradle.kts)
#   NDK 28.2.13676358 (from app/build.gradle.kts + ci.yml install)
# ─────────────────────────────────────────────────────────────────

name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'chore/**'
    paths:
      - 'Daxelo-Kinrel-App/**'
      - '.github/workflows/android-debug-apk.yml'

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ── Android SDK components (match app/build.gradle.kts) ──────
      - name: Install Android SDK & NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.1" \
            "platforms;android-33" "build-tools;33.0.0" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Native build toolchain (for thermion_dart / native assets) ──
      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      # ── Flutter dependencies + code generation ──────────────────
      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Static analysis (non-blocking — reports errors but doesn't
      #    fail the build, so the APK is still produced) ───────────
      - name: Flutter analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── Build debug APK ──────────────────────────────────────────
      # Uses the GitHub Secrets SUPABASE_URL + SUPABASE_ANON_KEY
      # (already configured in the repo's Actions secrets).  If the
      # secrets are not set, falls back to placeholder values so the
      # APK still builds (it just can't connect to Supabase at runtime).
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --debug
          --build-number=$GITHUB_RUN_NUMBER
          --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://placeholder.supabase.co}"
          --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-placeholder_anon_key}"

      # ── Upload the debug APK as a downloadable artifact ─────────
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      # ── Print artifact location for easy reference ───────────────
      - name: Summary
        if: always()
        run: |
          echo "## Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter**: ${{ env.FLUTTER_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK artifact name**: \`debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK path**: \`Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the workflow run page → Artifacts → \`debug-apk\`." >> $GITHUB_STEP_SUMMARY
