# ─────────────────────────────────────────────────────────────────
# Build B1 Verification APK — produces a downloadable release + debug
# APK so the B1 gate can be verified on a real Android device without
# any local Flutter/adb/Android SDK setup.
#
# Trigger: manual (workflow_dispatch). Not triggered by push.
# The actual B1 verification happens by hand on the device, reading
# the in-app /b1-verify report screen. CI does NOT verify the B1 gate.
# ─────────────────────────────────────────────────────────────────
name: Build B1 Verification APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode for the primary APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: b1-verification-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'
  FLUTTER_CHANNEL: 'stable'

jobs:
  build-apk:
    name: Build B1 Verification APK (release + debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install native build toolchain (clang, cmake, ninja, libdrm-dev, libc++)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build \
            libdrm-dev libgbm-dev libegl-dev libgl-dev libgles-dev \
            libc++-19-dev libc++1-19 libc++abi-19-dev libc++abi1-19 libunwind-19

      - name: Enable Flutter native assets
        run: flutter config --enable-native-assets

      - name: Flutter doctor (verify toolchain)
        run: flutter doctor -v

      - name: flutter pub get
        run: flutter pub get

      - name: Verify Thermion fork git dependency resolved (FAIL FAST)
        run: |
          if ! grep -q "thermion_fork" pubspec.lock; then
            echo "❌ FATAL: pubspec.lock does not reference the thermion_fork git repo."
            echo "   The Thermion dependency did not resolve correctly."
            exit 1
          fi
          echo "✅ Thermion fork git dependency resolved:"
          grep -A 4 "thermion_flutter:" pubspec.lock | head -8

      - name: Verify B1 test GLB exists + is declared (FAIL FAST)
        run: |
          if ! grep -q "assets/cameo/kinrel_cameo_b1_test.glb" pubspec.yaml; then
            echo "❌ FATAL: GLB not declared in pubspec.yaml assets"
            exit 1
          fi
          if [ ! -f assets/cameo/kinrel_cameo_b1_test.glb ]; then
            echo "❌ FATAL: GLB file does not exist on disk"
            exit 1
          fi
          echo "✅ B1 test GLB present ($(stat -c%s assets/cameo/kinrel_cameo_b1_test.glb) bytes)"

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis (report only — don't block on warnings)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64,android-arm32

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify libthermion_dart.so is in the release APK (FAIL FAST)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "── APK files ──"
          ls -lh $APK
          echo "── Native libs in release APK ──"
          unzip -l $APK | grep "\.so" | head -20
          if ! unzip -l $APK | grep -q "libthermion_dart.so"; then
            echo "❌ FATAL: libthermion_dart.so NOT in release APK"
            exit 1
          fi
          echo "✅ libthermion_dart.so is in the release APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-b1-verification-release-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-b1-verification-debug-apk
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-build-logs
          path: |
            Daxelo-Kinrel-App/build/app/outputs/logs/
            Daxelo-Kinrel-App/.dart_tool/hooks_runner/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          echo "## B1 Verification APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release APK | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps (B1 gate verification — by hand on device)" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the release APK artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Install on a real Android arm64 device (see CI_APK_DOWNLOAD.md)" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the app, navigate to /b1-verify (deep link)" >> $GITHUB_STEP_SUMMARY
          echo "4. Read the in-app B1 report screen — all 8 criteria must PASS" >> $GITHUB_STEP_SUMMARY
          echo "5. Tap Copy Report and paste the result into the worklog" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ This workflow ONLY produces the APK. The B1 gate itself is NOT verified by CI." >> $GITHUB_STEP_SUMMARY
