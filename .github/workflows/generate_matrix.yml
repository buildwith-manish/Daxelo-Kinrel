name: Generate Kinship Matrix CSV

# Generates the 5363x5363 = 28,761,769-row kinship_matrix.csv from indian_kinship.json
# Output is uploaded as a workflow artifact that the turso_upload.yml workflow downloads.
#
# Re-run this workflow only when:
#   - indian_kinship.json changes
#   - generate_kinship_matrix.py changes
#   - You want to regenerate the CSV from scratch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Daxelo-Kinrel-App/assets/data/indian_kinship.json'
      - 'scripts/generate_kinship_matrix.py'

concurrency:
  group: generate-matrix
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Generation takes ~2 minutes locally; allow 30 for safety

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # No cache: 'pip' — this repo has no requirements.txt/pyproject.toml.
        # The generator script uses only stdlib (json, csv, etc.).

    - name: Verify source JSON exists
      run: |
        if [ ! -f Daxelo-Kinrel-App/assets/data/indian_kinship.json ]; then
          echo "ERROR: Daxelo-Kinrel-App/assets/data/indian_kinship.json not found"
          exit 1
        fi
        SIZE=$(stat -c%s Daxelo-Kinrel-App/assets/data/indian_kinship.json)
        SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
        echo "Source JSON: ${SIZE_MB} MB"

    - name: Generate kinship_matrix.csv
      run: |
        echo "Starting generation..."
        python scripts/generate_kinship_matrix.py \
          Daxelo-Kinrel-App/assets/data/indian_kinship.json \
          kinship_matrix.csv
        echo ""
        echo "=== Generation complete ==="
        ls -la kinship_matrix.csv
        echo ""
        echo "Row count (incl header):"
        wc -l kinship_matrix.csv

    - name: Verify CSV is valid
      run: |
        # Quick sanity check: read first 1000 rows, verify 4 cols each
        python3 -c "
        import csv
        with open('kinship_matrix.csv') as f:
            reader = csv.reader(f)
            header = next(reader)
            assert header == ['from_key', 'via_key', 'result_key', 'result_female_key'], f'Bad header: {header}'
            for i, row in enumerate(reader):
                if i >= 1000: break
                assert len(row) == 4, f'Row {i+2} has {len(row)} cols'
            print(f'CSV valid: header + first 1000 rows OK')
        "

    - name: Compress CSV for artifact storage
      run: |
        echo "Compressing CSV with gzip..."
        gzip -9 kinship_matrix.csv
        ls -la kinship_matrix.csv.gz

    - name: Upload compressed CSV as artifact
      uses: actions/upload-artifact@v4
      with:
        name: kinship-matrix
        path: kinship_matrix.csv.gz
        retention-days: 90   # Keep for 3 months; re-run workflow to refresh
        compression-level: 0 # Already gzip'd; no point double-compressing

    - name: Summary
      run: |
        echo "============================================================"
        echo "KINSHIP MATRIX CSV GENERATED"
        echo "============================================================"
        echo "Artifact: kinship-matrix (contains kinship_matrix.csv.gz)"
        echo "Retention: 90 days"
        echo ""
        echo "Next step: run the 'Upload Kinship Matrix to Turso' workflow"
        echo "to upload this CSV to your Turso database."
