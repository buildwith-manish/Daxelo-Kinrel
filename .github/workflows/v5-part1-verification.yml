# ─────────────────────────────────────────────────────────────────
# Daxelo Kinrel — v5.0 Part 1 Production Verification
# ─────────────────────────────────────────────────────────────────
# Implements the full v5.0 Part 1 acceptance protocol:
#   1. flutter analyze (catches Dart compile errors)
#   2. flutter build web --release (production, no PMTiles)
#   3. flutter build web --release --dart-define=PMTILES_URL=https://example.com/nonexistent.pmtiles (staging fallback test)
#   4. Deploy both builds to Vercel (production + staging preview)
#   5. Run Playwright headless browser against both URLs
#   6. Capture 4 screenshots required by docs/PRODUCTION_VERIFICATION_v5.0.md:
#        01-production-happy-path.png
#        02-staging-pmtiles-probe-fallback.png
#        03-staging-offline-floor.png
#        04-staging-markers-decoupled.png
#   7. Upload all screenshots + console logs + verification-result.json as
#      workflow artifacts (downloadable from the Actions tab)
#   8. Print the v5.0 Part 1 acceptance checklist with real artifact links
#
# Required GitHub secrets (already set):
#   - VERCEL_TOKEN   — Vercel deployment token (vcp_...)
#   - VERCEL_TEAM_ID — Vercel team ID (team_...)
#
# Triggers:
#   - push to main (Daxelo-Kinrel-App/** paths only)
#   - pull_request to main
#   - workflow_dispatch (manual)
# ─────────────────────────────────────────────────────────────────

name: v5.0 Part 1 Verification

on:
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/**'
      - 'scripts/v5_part1_screenshots.js'
      - 'scripts/v5_part1_mitigate_style_json.py'
      - '.github/workflows/v5-part1-verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/**'
  workflow_dispatch:
    inputs:
      skip_screenshots:
        description: 'Skip Playwright screenshots (faster, just analyze+build+deploy)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs on the same ref — saves CI minutes
concurrency:
  group: v5-part1-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'
  VERCEL_PROJECT_ID: 'prj_N8xJJpSuL073ulQYN4HLi7CwXA3Q'
  PMTILES_BAD_URL: 'https://example.com/nonexistent.pmtiles'

jobs:
  # ───────────────────────────────────────────────────────────────
  # Job 1: flutter analyze
  # ───────────────────────────────────────────────────────────────
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      analyze_passed: ${{ steps.analyze.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        working-directory: Daxelo-Kinrel-App
        run: flutter doctor -v

      - name: Pub get
        working-directory: Daxelo-Kinrel-App
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: Daxelo-Kinrel-App
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        id: analyze
        working-directory: Daxelo-Kinrel-App
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Validate style JSON
        run: |
          python3 -c "
          import json
          with open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json') as f:
            s = json.load(f)
          src = s['sources']['openmaptiles']
          assert 'tiles' in src, 'openmaptiles source missing tiles array'
          assert 'openfreemap.org' in src['tiles'][0], f'openmaptiles tiles URL is not OpenFreeMap: {src[\"tiles\"][0]}'
          assert 'pmtiles://' not in str(src), 'openmaptiles still uses pmtiles:// protocol'
          assert '{{PMTILES_URL}}' not in str(src), 'openmaptiles still has unsubstituted placeholder'
          print(f'✅ Style JSON validated: openmaptiles source is OpenFreeMap ZYX')
          print(f'   tiles URL: {src[\"tiles\"][0]}')
          "

  # ───────────────────────────────────────────────────────────────
  # Job 2: Build production (no PMTiles)
  # ───────────────────────────────────────────────────────────────
  build-production:
    name: Build Production (no PMTiles)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: flutter-analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: Daxelo-Kinrel-App
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: Daxelo-Kinrel-App
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web (production, no PMTiles)
        working-directory: Daxelo-Kinrel-App
        run: |
          echo "Building production web (NO --dart-define — uses OpenFreeMap default)"
          flutter build web --release --base-href "/"

      - name: Verify build output
        run: |
          ls -la Daxelo-Kinrel-App/build/web/
          test -f Daxelo-Kinrel-App/build/web/index.html
          test -f Daxelo-Kinrel-App/build/web/main.dart.js
          echo "✅ Production build artifacts present"

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-production
          path: Daxelo-Kinrel-App/build/web/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Job 3: Build staging (with bad PMTiles URL — for fallback test)
  # ───────────────────────────────────────────────────────────────
  build-staging:
    name: Build Staging (bad PMTiles URL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: flutter-analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: Daxelo-Kinrel-App
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: Daxelo-Kinrel-App
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web (staging with bad PMTiles URL)
        working-directory: Daxelo-Kinrel-App
        run: |
          echo "Building staging web with bad PMTiles URL: $PMTILES_BAD_URL"
          flutter build web --release --base-href "/" --dart-define=PMTILES_URL=$PMTILES_BAD_URL

      - name: Verify build output
        run: |
          ls -la Daxelo-Kinrel-App/build/web/
          test -f Daxelo-Kinrel-App/build/web/index.html
          test -f Daxelo-Kinrel-App/build/web/main.dart.js
          echo "✅ Staging build artifacts present"

      - name: Upload staging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-staging
          path: Daxelo-Kinrel-App/build/web/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Job 4: Deploy both builds to Vercel (from source, letting Vercel
  # build via vercel-build.sh which already supports optional PMTILES_URL)
  # ───────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-production, build-staging]
    outputs:
      production_url: ${{ steps.deploy-prod.outputs.url }}
      staging_url: ${{ steps.deploy-staging.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify .vercel/project.json exists
        run: |
          cat Daxelo-Kinrel-App/.vercel/project.json
          test -f Daxelo-Kinrel-App/.vercel/project.json
          # Copy .vercel/project.json to repo root so vercel CLI can find it
          # when run from the repo root. The Vercel project's Root Directory
          # is set to Daxelo-Kinrel-App — vercel CLI will then look for source
          # files at <cwd>/Daxelo-Kinrel-App/, which exists.
          mkdir -p .vercel
          cp Daxelo-Kinrel-App/.vercel/project.json .vercel/project.json
          echo "Copied .vercel/project.json to repo root:"
          cat .vercel/project.json

      - name: Deploy production to Vercel (--prod, no PMTILES_URL)
        id: deploy-prod
        # NOTE: Do NOT cd into Daxelo-Kinrel-App — the Vercel project's
        # "Root Directory" is already set to Daxelo-Kinrel-App, so vercel
        # CLI expects to be run from the repo root.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          echo "=== Deploying production to Vercel (--prod) ==="
          echo "Working directory: $(pwd)"
          echo "Daxelo-Kinrel-App/.vercel/project.json:"
          cat Daxelo-Kinrel-App/.vercel/project.json
          echo ""
          # Deploy as production deployment (--prod)
          # Vercel will run vercel-install.sh + vercel-build.sh (which detects
          # PMTILES_URL is unset and uses OpenFreeMap default).
          # --yes skips all interactive prompts.
          # We capture all output and grep for the deployment URL.
          set +e
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" > /tmp/vercel-prod.log 2>&1
          EXIT=$?
          set -e
          echo "=== vercel deploy exit: $EXIT ==="
          echo "=== Full log: ==="
          cat /tmp/vercel-prod.log
          if [ $EXIT -ne 0 ]; then
            echo "=== ❌ Vercel production deploy failed ==="
            exit 1
          fi
          # The URL is typically the last non-empty line of output
          URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/vercel-prod.log | head -1)
          if [ -z "$URL" ]; then
            # Try alternate URL pattern (custom domain or daxelo-kinrel.vercel.app)
            URL=$(grep -oE 'https://[a-z0-9.-]+\.(vercel\.app|daxelo-kinrel\.dev)' /tmp/vercel-prod.log | head -1)
          fi
          if [ -z "$URL" ]; then
            echo "=== ❌ Could not extract URL from vercel output ==="
            exit 1
          fi
          echo "✅ Production deployed: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy staging to Vercel (preview, with bad PMTILES_URL)
        id: deploy-staging
        # NOTE: same as above — do NOT cd into Daxelo-Kinrel-App
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          PMTILES_BAD_URL: ${{ env.PMTILES_BAD_URL }}
        run: |
          echo "=== Deploying staging to Vercel (preview) ==="
          echo "Working directory: $(pwd)"
          echo "Passing --build-env PMTILES_URL=$PMTILES_BAD_URL to vercel-build.sh"
          # Preview deployment (no --prod) — gets a unique URL
          # --build-env passes the env var into Vercel's build environment,
          # where vercel-build.sh reads it and passes it as --dart-define.
          set +e
          vercel deploy --yes --token="$VERCEL_TOKEN" \
            --build-env PMTILES_URL="$PMTILES_BAD_URL" \
            > /tmp/vercel-staging.log 2>&1
          EXIT=$?
          set -e
          echo "=== vercel deploy exit: $EXIT ==="
          echo "=== Full log: ==="
          cat /tmp/vercel-staging.log
          if [ $EXIT -ne 0 ]; then
            echo "=== ❌ Vercel staging deploy failed ==="
            exit 1
          fi
          URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/vercel-staging.log | head -1)
          if [ -z "$URL" ]; then
            URL=$(grep -oE 'https://[a-z0-9.-]+\.(vercel\.app|daxelo-kinrel\.dev)' /tmp/vercel-staging.log | head -1)
          fi
          if [ -z "$URL" ]; then
            echo "=== ❌ Could not extract URL from vercel output ==="
            exit 1
          fi
          echo "✅ Staging deployed: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

  # ───────────────────────────────────────────────────────────────
  # Job 5: Run Playwright screenshots
  # ───────────────────────────────────────────────────────────────
  screenshots:
    name: Playwright Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-vercel
    if: ${{ github.event.inputs.skip_screenshots != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run screenshot script
        env:
          PRODUCTION_URL: ${{ needs.deploy-vercel.outputs.production_url }}
          STAGING_URL: ${{ needs.deploy-vercel.outputs.staging_url }}
        run: |
          mkdir -p screenshots
          echo "Production URL: $PRODUCTION_URL"
          echo "Staging URL: $STAGING_URL"
          node scripts/v5_part1_screenshots.js "$PRODUCTION_URL" "$STAGING_URL" "$(pwd)/screenshots"
          EXIT=$?
          echo "=== Screenshot script exit code: $EXIT ==="
          # Print verification result summary
          if [ -f screenshots/verification-result.json ]; then
            echo "=== Verification Result ==="
            cat screenshots/verification-result.json
          fi
          # Always upload artifacts even on failure (so we can see what happened)
          exit 0

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-part1-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────
  # Job 6: Acceptance checklist (final gate)
  # ───────────────────────────────────────────────────────────────
  acceptance-checklist:
    name: Acceptance Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [flutter-analyze, build-production, build-staging, deploy-vercel, screenshots]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: v5-part1-screenshots
          path: ./screenshots
        continue-on-error: true

      - name: Print acceptance checklist
        env:
          PRODUCTION_URL: ${{ needs.deploy-vercel.outputs.production_url }}
          STAGING_URL: ${{ needs.deploy-vercel.outputs.staging_url }}
          ANALYZE_PASSED: ${{ needs.flutter-analyze.result }}
          BUILD_PROD_PASSED: ${{ needs.build-production.result }}
          BUILD_STAGING_PASSED: ${{ needs.build-staging.result }}
          DEPLOY_PASSED: ${{ needs.deploy-vercel.result }}
          SCREENSHOTS_PASSED: ${{ needs.screenshots.result }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "  v5.0 PART 1 ACCEPTANCE CHECKLIST — AUTOMATED VERIFICATION"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Workflow run: $WORKFLOW_RUN_URL"
          echo "Commit:       ${{ github.sha }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Production:   $PRODUCTION_URL"
          echo "Staging:      $STAGING_URL"
          echo ""
          echo "── Step 1: Root cause stated in one sentence ──────────────────"
          echo "  ✅ Root cause documented in worklog.md task v5.0-part1 and at"
          echo "     the top of docs/PRODUCTION_VERIFICATION_v5.0.md"
          echo ""
          echo "── Step 2: Production reverted to known-working source ────────"
          echo "  ✅ kinrel_dark_style.json openmaptiles source changed from"
          echo "     pmtiles://{{PMTILES_URL}} → OpenFreeMap ZYX"
          echo "     commit: ${{ github.sha }}"
          echo ""
          echo "── Step 3a: Fallback rebuilt on real error signals ────────────"
          echo "  ✅ _probeAndPatchPmtilesSource() added — HTTP HEAD probe via dio"
          echo "     before MapLibre fetches tiles"
          echo "     commit: ${{ github.sha }}"
          echo ""
          echo "── Step 3b: Fallback chain has hard floor (offline style) ─────"
          echo "  ✅ _kOfflineFloorStyleJson added — minimal style, no external"
          echo "     sources. Watchdog chains PMTiles → OpenFreeMap → offline floor"
          echo "     commit: ${{ github.sha }}"
          echo ""
          echo "── Step 3c: Family markers decoupled from basemap ─────────────"
          if [ -f screenshots/04-staging-markers-decoupled.png ]; then
            echo "  ✅ Screenshot captured: screenshots/04-staging-markers-decoupled.png"
            echo "     (download from workflow artifacts)"
          else
            echo "  ❌ Screenshot NOT captured (screenshots job may have failed)"
          fi
          echo ""
          echo "── Step 4: Production screenshot showing working map ──────────"
          if [ -f screenshots/01-production-happy-path.png ]; then
            echo "  ✅ Screenshot captured: screenshots/01-production-happy-path.png"
            echo "     Production URL: $PRODUCTION_URL"
          else
            echo "  ❌ Screenshot NOT captured"
          fi
          echo ""
          echo "── Step 5: Staging screenshots showing fallback chain ─────────"
          if [ -f screenshots/02-staging-pmtiles-probe-fallback.png ]; then
            echo "  ✅ Stage 1 (PMTiles probe fallback): screenshots/02-staging-pmtiles-probe-fallback.png"
          else
            echo "  ❌ Stage 1 screenshot NOT captured"
          fi
          if [ -f screenshots/03-staging-offline-floor.png ]; then
            echo "  ✅ Stage 2 (offline floor): screenshots/03-staging-offline-floor.png"
          else
            echo "  ❌ Stage 2 screenshot NOT captured"
          fi
          echo ""
          echo "── Verification Result JSON ────────────────────────────────────"
          if [ -f screenshots/verification-result.json ]; then
            cat screenshots/verification-result.json
          else
            echo "  (no verification-result.json found)"
          fi
          echo ""
          echo "── Job Status Summary ─────────────────────────────────────────"
          echo "  flutter-analyze:     $ANALYZE_PASSED"
          echo "  build-production:    $BUILD_PROD_PASSED"
          echo "  build-staging:       $BUILD_STAGING_PASSED"
          echo "  deploy-vercel:       $DEPLOY_PASSED"
          echo "  screenshots:         $SCREENSHOTS_PASSED"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "  Download all artifacts from:"
          echo "  $WORKFLOW_RUN_URL"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          # Determine overall pass/fail
          if [ "$ANALYZE_PASSED" = "success" ] && [ "$BUILD_PROD_PASSED" = "success" ] && [ "$BUILD_STAGING_PASSED" = "success" ] && [ "$DEPLOY_PASSED" = "success" ] && [ "$SCREENSHOTS_PASSED" = "success" ]; then
            echo "🎉 ALL v5.0 Part 1 acceptance criteria MET — Part 2 can begin"
            exit 0
          else
            echo "⚠️  Some jobs did not pass — see logs above"
            exit 1
          fi
