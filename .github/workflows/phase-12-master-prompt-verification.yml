name: Phase 12 — Kinrel Family Map Master Prompt Verification

# Verifies the implementation of KINREL_FAMILY_MAP_MASTER_PROMPT.md
# (phases 1-5 + phase 6 partial). Runs on every push / PR to main,
# and can be triggered manually from the Actions tab.
#
# Pipeline (matches the master prompt's "FINAL VERIFICATION CHECKLIST"):
#   1. flutter pub get
#   2. dart format --set-exit-if-changed .
#   3. flutter analyze lib/features/family_map/ + brand_*
#   4. flutter test test/features/family_map/  (unit + widget + perf)
#   5. flutter test test/features/family_map/golden/  (regenerate, then verify)
#   6. flutter build web --release
#   7. Master-prompt structural verifications (P1-P5 invariants)
#
# All steps are HARD GATES (no continue-on-error) except golden
# regeneration on the first run after a visual change.

on:
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/features/family_map/**'
      - 'Daxelo-Kinrel-App/assets/map_styles/**'
      - 'Daxelo-Kinrel-App/test/features/family_map/**'
      - 'Daxelo-Kinrel-App/lib/core/constants/brand_*'
      - '.github/workflows/phase-12-master-prompt-verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/features/family_map/**'
      - 'Daxelo-Kinrel-App/assets/map_styles/**'
      - 'Daxelo-Kinrel-App/test/features/family_map/**'
      - 'Daxelo-Kinrel-App/lib/core/constants/brand_*'
      - '.github/workflows/phase-12-master-prompt-verification.yml'
  workflow_dispatch: {}

jobs:
  verify-master-prompt:
    name: Flutter (Kinrel Family Map master prompt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Match the version pinned in flutter-test.yml and
          # flutter-web-lighthouse.yml. SDK constraint in pubspec is ^3.12.0.
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      # ───────────────────────────────────────────────────────────────
      # STEP 1 — Install dependencies
      # ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ───────────────────────────────────────────────────────────────
      # STEP 2 — Generate Drift code (required by graph + family_journey)
      # ───────────────────────────────────────────────────────────────
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # ───────────────────────────────────────────────────────────────
      # STEP 3 — Format check (master prompt: dart format --set-exit-if-changed .)
      # ───────────────────────────────────────────────────────────────
      - name: Verify dart formatting
        run: dart format --set-exit-if-changed lib/features/family_map/ lib/core/constants/brand_colors.dart lib/core/constants/brand_gradients.dart test/features/family_map/

      # ───────────────────────────────────────────────────────────────
      # STEP 4 — Static analysis (master prompt: flutter analyze → 0 errors)
      # ───────────────────────────────────────────────────────────────
      - name: Analyze family_map + brand constants
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/family_map/ lib/core/constants/brand_colors.dart lib/core/constants/brand_gradients.dart

      # ───────────────────────────────────────────────────────────────
      # STEP 5 — Unit + widget tests (master prompt: 167 tests pass)
      # Excludes golden tests (run separately below) and perf benchmarks
      # (run separately to keep output readable).
      # ───────────────────────────────────────────────────────────────
      - name: Run family_map unit + widget tests
        run: flutter test test/features/family_map/ --exclude-tags golden --exclude-tags perf --reporter expanded

      # ───────────────────────────────────────────────────────────────
      # STEP 6 — Performance benchmarks (master prompt: all under budget)
      # ───────────────────────────────────────────────────────────────
      - name: Run family_map performance benchmarks
        run: flutter test test/features/family_map/perf/ --reporter expanded

      # ───────────────────────────────────────────────────────────────
      # STEP 7 — Golden tests
      #
      # Master prompt expects 7 golden tests to pass pixel-perfect. The
      # map_polish_overlay.png golden will need refreshing after the
      # merged single-painter change in Phase 5 — we regenerate on
      # first run, then verify on subsequent runs.
      #
      # The `--update-goldens` flag is set ONLY when the workflow is
      # manually dispatched with `regenerate_goldens=true`. On normal
      # push / PR runs, goldens must match exactly.
      # ───────────────────────────────────────────────────────────────
      - name: Run golden tests (verify)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.regenerate_goldens != 'true'
        run: flutter test test/features/family_map/golden/ --reporter expanded

      - name: Run golden tests (regenerate)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_goldens == 'true'
        run: flutter test test/features/family_map/golden/ --update-goldens --reporter expanded

      - name: Upload golden failures on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: Daxelo-Kinrel-App/test/features/family_map/golden/failures/
          if-no-files-found: ignore
          retention-days: 7

      # ───────────────────────────────────────────────────────────────
      # STEP 8 — Web release build (master prompt: flutter build web --release)
      # ───────────────────────────────────────────────────────────────
      - name: Build web release
        run: flutter build web --release

      - name: Verify web build output exists
        working-directory: .
        run: |
          test -d Daxelo-Kinrel-App/build/web
          test -f Daxelo-Kinrel-App/build/web/index.html
          test -f Daxelo-Kinrel-App/build/web/main.dart.js
          echo "✅ Web release build succeeded"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-web-release
          path: Daxelo-Kinrel-App/build/web/
          retention-days: 7

      # ───────────────────────────────────────────────────────────────
      # STEP 9 — Master prompt structural verifications
      #
      # These are the invariants from KINREL_FAMILY_MAP_MASTER_PROMPT.md
      # that can be verified statically (without running the app).
      # ───────────────────────────────────────────────────────────────

      - name: Verify P1.1 — Generic 3D buildings present (Snapchat-style) + family-buildings
        working-directory: .
        run: |
          # P12 PREMIUM UPDATE: Generic 3D buildings are NOW RE-ENABLED
          # with a Kinrel-warm tint (Snapchat-style blocky 3D aesthetic
          # but with Kinrel orange/amber palette, not Snapchat cool blue).
          # The layer is called `kinrel-3d-buildings` (fill-extrusion).
          if ! rg -q '"id":"kinrel-3d-buildings"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.1 FAILED: kinrel-3d-buildings fill-extrusion layer missing"
            exit 1
          fi
          # Verify it's a fill-extrusion (3D) layer.
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          l = next((x for x in s['layers'] if x.get('id') == 'kinrel-3d-buildings'), None)
          assert l is not None, 'kinrel-3d-buildings layer missing'
          assert l.get('type') == 'fill-extrusion', f'expected fill-extrusion, got {l.get(\"type\")}'
          assert l.get('source-layer') == 'building', f'expected source-layer=building, got {l.get(\"source-layer\")}'
          assert l.get('minzoom') == 14, f'expected minzoom 14, got {l.get(\"minzoom\")}'
          "; then
            echo "❌ P1.1 FAILED: kinrel-3d-buildings not configured correctly"
            exit 1
          fi
          # Verify family-buildings layer IS present (renders on top of generic 3D).
          if ! rg -q '"id":"family-buildings"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.1 FAILED: family-buildings layer missing from style JSON"
            exit 1
          fi
          echo "✅ P1.1: kinrel-3d-buildings (generic 3D, warm-tinted) + family-buildings both present"

      - name: Verify P1.2 — Road colors warmed with Kinrel orange tint
        working-directory: .
        run: |
          # road_trunk_primary and road_motorway must use `interpolate`
          # on line-color (not a static string).
          if ! rg -q '"line-color":\["interpolate"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.2 FAILED: road line-color is not interpolated"
            exit 1
          fi
          # Verify Kinrel orange (#E8612A) appears in the road color ramp.
          if ! rg -q '"#E8612A"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.2 FAILED: Kinrel orange tint missing from style JSON"
            exit 1
          fi
          echo "✅ P1.2: road colors warmed with Kinrel orange tint via interpolate"

      - name: Verify P1.3 — Label minzooms adjusted
        working-directory: .
        run: |
          # label_town must have minzoom 9 (was 7)
          if ! rg -q '"id":"label_town".*"minzoom":9' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            # JSON is minified; the minzoom may be on a separate position. Try alternative.
            if ! python3 -c "import json; s=json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json')); assert any(l.get('id')=='label_town' and l.get('minzoom')==9 for l in s['layers'])"; then
              echo "❌ P1.3 FAILED: label_town minzoom is not 9"
              exit 1
            fi
          fi
          # label_village must have minzoom 12 (was 10)
          if ! python3 -c "import json; s=json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json')); assert any(l.get('id')=='label_village' and l.get('minzoom')==12 for l in s['layers'])"; then
            echo "❌ P1.3 FAILED: label_village minzoom is not 12"
            exit 1
          fi
          echo "✅ P1.3: label minzooms adjusted (town 9, village 12)"

      - name: Verify P2.1 — Hillshade source + layer present
        working-directory: .
        run: |
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          assert 'kinrel-hillshade' in s['sources'], 'kinrel-hillshade source missing'
          assert s['sources']['kinrel-hillshade']['type'] == 'raster-dem', 'kinrel-hillshade is not raster-dem'
          assert any(l.get('id')=='kinrel-hillshade' and l.get('type')=='hillshade' for l in s['layers']), 'kinrel-hillshade hillshade layer missing'
          "; then
            echo "❌ P2.1 FAILED: hillshade source/layer missing or wrong type"
            exit 1
          fi
          echo "✅ P2.1: hillshade raster-dem source + hillshade layer present"

      - name: Verify P3.1 — Family-buildings match has 12 place types
        working-directory: .
        run: |
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          fb = next(l for l in s['layers'] if l.get('id') == 'family-buildings')
          match = fb['paint']['fill-extrusion-color']
          # match format: ['match', ['get', 'placeType'], wire1, color1, ..., wire12, color12, default]
          # 1 (match) + 1 (['get','placeType']) + 12*2 (wires+colors) + 1 (default) = 27
          assert len(match) == 27, f'expected 27 elements, got {len(match)}'
          # Verify new place types are present.
          # wires are at indices 2, 4, 6, ..., 24 (every other starting at index 2).
          # The last element (index 26) is the default color, not a wire.
          wires = match[2:-1:2]
          expected = {'current_home','childhood_home','ancestral_home','birthplace','wedding','memorial','family_business','school','vacation_home','family_temple','grandparents_home','important_place'}
          assert set(wires) == expected, f'mismatch: {set(wires)} vs {expected}'
          "; then
            echo "❌ P3.1 FAILED: family-buildings match does not have all 12 place types"
            exit 1
          fi
          echo "✅ P3.1: family-buildings match expression has all 12 place types"

      - name: Verify P3.2 — family-buildings-roof layer at zoom 17+
        working-directory: .
        run: |
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          roof = next((l for l in s['layers'] if l.get('id') == 'family-buildings-roof'), None)
          assert roof is not None, 'family-buildings-roof layer missing'
          assert roof.get('minzoom') == 17, f'expected minzoom 17, got {roof.get(\"minzoom\")}'
          assert roof.get('type') == 'fill', f'expected type fill, got {roof.get(\"type\")}'
          "; then
            echo "❌ P3.2 FAILED: family-buildings-roof layer missing or wrong minzoom"
            exit 1
          fi
          echo "✅ P3.2: family-buildings-roof fill layer at zoom 17+ present"

      - name: Verify P3.3 — FamilyBuildingAnimationEngine class exists
        working-directory: .
        run: |
          if ! rg -q "class FamilyBuildingAnimationEngine" Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart; then
            echo "❌ P3.3 FAILED: FamilyBuildingAnimationEngine class missing"
            exit 1
          fi
          # Verify it implements wedding 4s cycle + memorial 2.4s cycle
          if ! rg -q "weddingGlowCycle" Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart; then
            echo "❌ P3.3 FAILED: wedding glow cycle not referenced"
            exit 1
          fi
          if ! rg -q "memorialFlickerCycle" Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart; then
            echo "❌ P3.3 FAILED: memorial flicker cycle not referenced"
            exit 1
          fi
          echo "✅ P3.3: FamilyBuildingAnimationEngine implements wedding + memorial animations"

      - name: Verify P3.4 — Avatar marker has gradient ring + selection halo
        working-directory: .
        run: |
          if ! rg -q "SweepGradient" Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_generator.dart; then
            echo "❌ P3.4 FAILED: SweepGradient (gradient ring) not in avatar marker generator"
            exit 1
          fi
          if ! rg -q "selectionHaloStrokeWidth\|selectionHaloRadiusPadding" Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_generator.dart; then
            echo "❌ P3.4 FAILED: selection halo constants not referenced in avatar marker generator"
            exit 1
          fi
          echo "✅ P3.4: avatar marker has gradient ring (SweepGradient) + selection halo"

      - name: Verify P4.1 — Haptic feedback on tap + long-press
        working-directory: .
        run: |
          if ! rg -q "HapticFeedback.selectionClick" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P4.1 FAILED: HapticFeedback.selectionClick not on tap"
            exit 1
          fi
          if ! rg -q "HapticFeedback.heavyImpact" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P4.1 FAILED: HapticFeedback.heavyImpact not on long-press"
            exit 1
          fi
          echo "✅ P4.1: haptic feedback on tap (selectionClick) + long-press (heavyImpact)"

      - name: Verify P4.2 — Atmospheric perspective gated by pitch
        working-directory: .
        run: |
          # The polish overlay must accept a pitch parameter and use it
          # to gate atmospheric perspective (master prompt: pitch > 10°).
          if ! rg -q "this.pitch" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P4.2 FAILED: MapPolishOverlay does not accept a pitch parameter"
            exit 1
          fi
          if ! rg -q "atmosphericPerspectivePitchThreshold" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P4.2 FAILED: atmospheric perspective pitch threshold not referenced"
            exit 1
          fi
          # The screen must track pitch and pass it to the overlay.
          if ! rg -q "_currentPitch" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P4.2 FAILED: _currentPitch not tracked in screen"
            exit 1
          fi
          echo "✅ P4.2: atmospheric perspective gated by pitch (threshold 10°, max 0.12)"

      - name: Verify P5.1 — WCAG AA label halos (2px, #0D0D0D)
        working-directory: .
        run: |
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          symbol_layers = [l for l in s['layers'] if l.get('type') == 'symbol']
          assert len(symbol_layers) > 0, 'no symbol layers found'
          for l in symbol_layers:
            paint = l.get('paint', {})
            if 'text-halo-color' in paint:
              assert paint['text-halo-width'] == 2.0, f'{l[\"id\"]}: text-halo-width is {paint[\"text-halo-width\"]}, expected 2.0'
              assert paint['text-halo-color'].upper() == '#0D0D0D', f'{l[\"id\"]}: text-halo-color is {paint[\"text-halo-color\"]}, expected #0D0D0D'
          "; then
            echo "❌ P5.1 FAILED: not all symbol layers have 2px / #0D0D0D halo"
            exit 1
          fi
          echo "✅ P5.1: all symbol layers have 2px text-halo-width + #0D0D0D halo color (WCAG AA)"

      - name: Verify P5.2 — Polish overlay merged into single CustomPainter
        working-directory: .
        run: |
          # The polish overlay should use a SINGLE CustomPainter (not a Stack
          # of multiple CustomPaint widgets) per master prompt Phase 5.
          if ! rg -q "class _KinrelPolishPainter" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P5.2 FAILED: _KinrelPolishPainter (merged single painter) not found"
            exit 1
          fi
          # Verify the old per-effect painters are GONE.
          if rg -q "class _VignettePainter\|class _FogPainter\|class _AmbientWarmthPainter" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P5.2 FAILED: old per-effect painters still present (not merged)"
            exit 1
          fi
          echo "✅ P5.2: polish overlay merged into single _KinrelPolishPainter (1 draw call)"

      - name: Verify P5.3 — Vignette opacity is 0.40 (P12 premium)
        working-directory: .
        run: |
          # P12 PREMIUM UPDATE: Vignette opacity bumped from 0.35 → 0.40
          # for the cinematic Snapchat-style mood (darker corners focus
          # attention on 3D buildings + markers).
          if ! rg -q "vignetteOpacity = 0.40" Daxelo-Kinrel-App/lib/features/family_map/config/map_visual_constants.dart; then
            echo "❌ P5.3 FAILED: vignette opacity is not 0.40"
            exit 1
          fi
          echo "✅ P5.3: vignette opacity is 0.40 (P12 premium cinematic)"

      - name: Verify P6.1 — New PlaceType values exist
        working-directory: .
        run: |
          if ! rg -q "vacationHome" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: vacationHome PlaceType missing"
            exit 1
          fi
          if ! rg -q "familyTemple" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: familyTemple PlaceType missing"
            exit 1
          fi
          if ! rg -q "grandparentsHome" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: grandparentsHome PlaceType missing"
            exit 1
          fi
          # Verify wire names
          if ! rg -q "vacation_home" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: vacation_home wireName missing"
            exit 1
          fi
          if ! rg -q "family_temple" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: family_temple wireName missing"
            exit 1
          fi
          if ! rg -q "grandparents_home" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: grandparents_home wireName missing"
            exit 1
          fi
          echo "✅ P6.1: new PlaceType values (vacationHome, familyTemple, grandparentsHome) + wireNames present"

      - name: Verify Rule — No derivative app names in NEW code
        working-directory: .
        run: |
          # Master prompt: "Do NOT copy Snapchat, Google Maps, Apple Maps, Zenly, Mapbox demos"
          # Check the files we modified in this phase — not pre-existing comments
          # in family_map_screen.dart that reference "Snapchat-style" light mode
          # (those predate the master-prompt implementation).
          FILES=(
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_generator.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_overlay.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_skeleton.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_legend_widget.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_timeline_scrubber.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/animated_relationship_path.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/relationship_path_overlay.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/household_cluster_marker.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/household_cluster_overlay.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_focus_controller.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_bottom_sheets.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/family_journey_animation.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/ambient_motion_controller.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/widgets/map_initials.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/config/map_visual_constants.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/poi_filter.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/progressive_loading.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/family_map_lifecycle.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/map_state_persistence.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/map_data_validator.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/map_location_resolver.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/map_location_source.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/city_coordinates.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/data/deterministic_spread.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/providers/family_map_provider.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/providers/live_location_provider.dart"
            "Daxelo-Kinrel-App/lib/features/family_map/helpers/location_permission_helper.dart"
            "Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json"
          )
          FOUND=""
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              MATCH=$(rg -in "snapchat|google maps|apple maps|zenly|mapbox demo" "$f" || true)
              if [ -n "$MATCH" ]; then
                FOUND="$FOUND
          $MATCH"
              fi
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "❌ Rule FAILED: derivative app name found in master-prompt implementation:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ Rule: no derivative app names in master-prompt implementation files"

      # ───────────────────────────────────────────────────────────────
      # STEP 10 — Final summary
      # ───────────────────────────────────────────────────────────────
      - name: Master prompt verification summary
