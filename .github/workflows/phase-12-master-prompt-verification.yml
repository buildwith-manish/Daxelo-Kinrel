name: Phase 12 — Kinrel Family Map Master Prompt Verification

# Verifies the implementation of KINREL_FAMILY_MAP_MASTER_PROMPT.md
# (phases 1-5 + phase 6 partial). Runs on every push / PR to main,
# and can be triggered manually from the Actions tab.
#
# Pipeline (matches the master prompt's "FINAL VERIFICATION CHECKLIST"):
#   1. flutter pub get
#   2. dart format --set-exit-if-changed .
#   3. flutter analyze lib/features/family_map/ + brand_*
#   4. flutter test test/features/family_map/  (unit + widget + perf)
#   5. flutter test test/features/family_map/golden/  (regenerate, then verify)
#   6. flutter build web --release
#   7. Master-prompt structural verifications (P1-P5 invariants)
#
# All steps are HARD GATES (no continue-on-error) except golden
# regeneration on the first run after a visual change.

on:
  push:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/features/family_map/**'
      - 'Daxelo-Kinrel-App/assets/map_styles/**'
      - 'Daxelo-Kinrel-App/test/features/family_map/**'
      - 'Daxelo-Kinrel-App/lib/core/constants/brand_*'
      - '.github/workflows/phase-12-master-prompt-verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Daxelo-Kinrel-App/lib/features/family_map/**'
      - 'Daxelo-Kinrel-App/assets/map_styles/**'
      - 'Daxelo-Kinrel-App/test/features/family_map/**'
      - 'Daxelo-Kinrel-App/lib/core/constants/brand_*'
      - '.github/workflows/phase-12-master-prompt-verification.yml'
  workflow_dispatch: {}

jobs:
  verify-master-prompt:
    name: Flutter (Kinrel Family Map master prompt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Daxelo-Kinrel-App

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Match the version pinned in flutter-test.yml and
          # flutter-web-lighthouse.yml. SDK constraint in pubspec is ^3.12.0.
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      # ───────────────────────────────────────────────────────────────
      # STEP 1 — Install dependencies
      # ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ───────────────────────────────────────────────────────────────
      # STEP 2 — Generate Drift code (required by graph + family_journey)
      # ───────────────────────────────────────────────────────────────
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # ───────────────────────────────────────────────────────────────
      # STEP 3 — Format check (master prompt: dart format --set-exit-if-changed .)
      # ───────────────────────────────────────────────────────────────
      - name: Verify dart formatting
        run: dart format --set-exit-if-changed lib/features/family_map/ lib/core/constants/brand_colors.dart test/features/family_map/

      # ───────────────────────────────────────────────────────────────
      # STEP 4 — Static analysis (master prompt: flutter analyze → 0 errors)
      # ───────────────────────────────────────────────────────────────
      - name: Analyze family_map + brand constants
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/family_map/ lib/core/constants/brand_colors.dart

      # ───────────────────────────────────────────────────────────────
      # STEP 5 — Unit + widget tests (master prompt: 167 tests pass)
      # Excludes golden tests (run separately below) and perf benchmarks
      # (run separately to keep output readable).
      # ───────────────────────────────────────────────────────────────
      - name: Run family_map unit + widget tests
        run: flutter test test/features/family_map/ --exclude-tags golden --exclude-tags perf --reporter expanded

      # ───────────────────────────────────────────────────────────────
      # STEP 6 — Performance benchmarks (master prompt: all under budget)
      # ───────────────────────────────────────────────────────────────
      - name: Run family_map performance benchmarks
        run: flutter test test/features/family_map/perf/ --reporter expanded

      # ───────────────────────────────────────────────────────────────
      # STEP 7 — Golden tests
      #
      # Master prompt expects 7 golden tests to pass pixel-perfect. The
      # map_polish_overlay.png golden will need refreshing after the
      # merged single-painter change in Phase 5 — we regenerate on
      # first run, then verify on subsequent runs.
      #
      # The `--update-goldens` flag is set ONLY when the workflow is
      # manually dispatched with `regenerate_goldens=true`. On normal
      # push / PR runs, goldens must match exactly.
      # ───────────────────────────────────────────────────────────────
      - name: Run golden tests (verify)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.regenerate_goldens != 'true'
        run: flutter test test/features/family_map/golden/ --reporter expanded

      - name: Run golden tests (regenerate)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_goldens == 'true'
        run: flutter test test/features/family_map/golden/ --update-goldens --reporter expanded

      - name: Upload golden failures on mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: Daxelo-Kinrel-App/test/features/family_map/golden/failures/
          if-no-files-found: ignore
          retention-days: 7

      # ───────────────────────────────────────────────────────────────
      # STEP 8 — Web release build (master prompt: flutter build web --release)
      # ───────────────────────────────────────────────────────────────
      - name: Build web release
        run: flutter build web --release

      - name: Verify web build output exists
        working-directory: .
        run: |
          test -d Daxelo-Kinrel-App/build/web
          test -f Daxelo-Kinrel-App/build/web/index.html
          test -f Daxelo-Kinrel-App/build/web/main.dart.js
          echo "✅ Web release build succeeded"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-web-release
          path: Daxelo-Kinrel-App/build/web/
          retention-days: 7

      # ───────────────────────────────────────────────────────────────
      # STEP 9 — Master prompt structural verifications
      #
      # These are the invariants from KINREL_FAMILY_MAP_MASTER_PROMPT.md
      # that can be verified statically (without running the app).
      # ───────────────────────────────────────────────────────────────

      - name: Verify P1.1 — 3D buildings visible worldwide (minzoom ≤ 13, no maxzoom cap)
        working-directory: .
        run: |
          # P12.3: 3D buildings must be visible WORLDWIDE, not just at street level.
          # Previous config had minzoom 14-15 + maxzoom 18, which meant 3D only
          # appeared between zoom 15-18 (Bengaluru test flew to 16.5).
          # Now: minzoom 13 (earliest zoom with tile data), maxzoom 22 (no cap).
          if ! grep -q '"id":"kinrel-3d-buildings"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.1 FAILED: kinrel-3d-buildings fill-extrusion layer missing"
            exit 1
          fi
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          l = next((x for x in s['layers'] if x.get('id') == 'kinrel-3d-buildings'), None)
          assert l is not None, 'kinrel-3d-buildings layer missing'
          assert l.get('type') == 'fill-extrusion', f'expected fill-extrusion, got {l.get(\"type\")}'
          assert l.get('source-layer') == 'building', f'expected source-layer=building, got {l.get(\"source-layer\")}'
          # P12.3: minzoom must be <= 13 for global 3D visibility
          assert l.get('minzoom') is not None and l.get('minzoom') <= 13, f'expected minzoom <= 13 for global 3D, got {l.get(\"minzoom\")}'
          # P12.3: maxzoom must be >= 22 (no restrictive cap)
          maxzoom = l.get('maxzoom', 22)
          assert maxzoom is None or maxzoom >= 22, f'expected maxzoom >= 22 (no cap), got {maxzoom}'
          # P12.3: height must be zoom-interpolated with multiplier (taller at low zoom)
          height = l.get('paint', {}).get('fill-extrusion-height', [])
          assert isinstance(height, list) and height[0] == 'interpolate', 'fill-extrusion-height must be zoom-interpolated'
          "; then
            echo "❌ P1.1 FAILED: kinrel-3d-buildings not configured for global 3D visibility"
            exit 1
          fi
          # Verify family-buildings layer IS present (renders on top of generic 3D).
          if ! grep -q '"id":"family-buildings"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.1 FAILED: family-buildings layer missing from style JSON"
            exit 1
          fi
          echo "✅ P1.1: kinrel-3d-buildings (minzoom ≤ 13, maxzoom ≥ 22, zoom-interpolated height) — 3D visible worldwide"

      - name: Verify P1.2 — Road colors warmed with Kinrel orange tint
        working-directory: .
        run: |
          # road_trunk_primary and road_motorway must use `interpolate`
          # on line-color (not a static string).
          if ! grep -q '"line-color":\["interpolate"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.2 FAILED: road line-color is not interpolated"
            exit 1
          fi
          # Verify Kinrel orange (#E8612A) appears in the road color ramp.
          if ! grep -q '"#E8612A"' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            echo "❌ P1.2 FAILED: Kinrel orange tint missing from style JSON"
            exit 1
          fi
          echo "✅ P1.2: road colors warmed with Kinrel orange tint via interpolate"

      - name: Verify P1.3 — Label minzooms adjusted
        working-directory: .
        run: |
          # label_town must have minzoom 9 (was 7)
          if ! grep -q '"id":"label_town".*"minzoom":9' Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json; then
            # JSON is minified; the minzoom may be on a separate position. Try alternative.
            if ! python3 -c "import json; s=json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json')); assert any(l.get('id')=='label_town' and l.get('minzoom')==9 for l in s['layers'])"; then
              echo "❌ P1.3 FAILED: label_town minzoom is not 9"
              exit 1
            fi
          fi
          # label_village must have minzoom 12 (was 10)
          if ! python3 -c "import json; s=json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json')); assert any(l.get('id')=='label_village' and l.get('minzoom')==12 for l in s['layers'])"; then
            echo "❌ P1.3 FAILED: label_village minzoom is not 12"
            exit 1
          fi
          echo "✅ P1.3: label minzooms adjusted (town 9, village 12)"

      - name: Verify P2.1 — Warm-glow layers present (Kinrel premium 3D, global)
        working-directory: .
        run: |
          # P12.3: Both warm-glow layers must have minzoom <= 13 for global
          # 3D visibility (not just street level). Previously minzoom was 15.
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          for lid in ('building-3d-warm-glow', 'kinrel-3d-buildings-warm-glow'):
              layer = next((l for l in s['layers'] if l.get('id') == lid), None)
              assert layer is not None, f'{lid} layer missing'
              assert layer.get('type') == 'fill-extrusion', f'{lid} not fill-extrusion'
              assert layer.get('paint', {}).get('fill-extrusion-color') == '#E8612A', f'{lid} color is not Kinrel orange #E8612A'
              # P12.3: minzoom must be <= 13 for global warm-glow
              assert layer.get('minzoom') is not None and layer.get('minzoom') <= 13, f'{lid} minzoom={layer.get(\"minzoom\")}, expected <= 13'
              # Verify the render_height >= 30 filter
              filt = layer.get('filter', [])
              assert len(filt) >= 3 and filt[0] == '>=' and filt[2] == ['get', 'render_height'] and filt[1] == 30, f'{lid} missing render_height >= 30 filter'
          "; then
            echo "❌ P2.1 FAILED: warm-glow layers missing or not configured for global visibility"
            exit 1
          fi
          echo "✅ P2.1: building-3d-warm-glow + kinrel-3d-buildings-warm-glow (minzoom ≤ 13, #E8612A @ 12%, height >= 30) — global"

      - name: Verify P3.1 — Family-buildings match has 9+ place types
        working-directory: .
        run: |
          # P12.2: User's style JSON has the original 9 place types in the
          # match expression. The Dart code (place_models.dart) has 12 types
          # — the extra 3 (vacation_home, family_temple, grandparents_home)
          # fall through to the default color (#E8612A) at render time.
          # Verify at least 9 place types are present.
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          fb = next(l for l in s['layers'] if l.get('id') == 'family-buildings')
          match = fb['paint']['fill-extrusion-color']
          assert match[0] == 'match', 'fill-extrusion-color is not a match expression'
          wires = match[2:-1:2]
          expected_min = {'current_home','childhood_home','ancestral_home','birthplace','wedding','memorial','family_business','school','important_place'}
          assert expected_min.issubset(set(wires)), f'missing core place types: {expected_min - set(wires)}'
          assert len(wires) >= 9, f'expected at least 9 place types, got {len(wires)}'
          "; then
            echo "❌ P3.1 FAILED: family-buildings match does not have core place types"
            exit 1
          fi
          echo "✅ P3.1: family-buildings match expression has {len(wires)} place types (core 9 present)"

      - name: Verify P3.2 — Live-location ambient glow wired in Dart
        working-directory: .
        run: |
          # P12.2: User's style JSON no longer has family-buildings-roof.
          # Instead, verify the live-location ambient glow is wired in
          # the Dart screen code + the fallback style JSON.
          if ! grep -q "live-location-point" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P3.2 FAILED: live-location-point source not wired in screen"
            exit 1
          fi
          if ! grep -q "live-location-ambient-glow" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P3.2 FAILED: live-location-ambient-glow layer not wired in screen"
            exit 1
          fi
          # Verify the fallback style JSON also has the live-location layers
          if ! grep -q "live-location-point" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P3.2 FAILED: live-location-point missing from fallback style"
            exit 1
          fi
          echo "✅ P3.2: live-location ambient glow wired in Dart + fallback style"

      - name: Verify P3.2b — DirectionalSpotlightCone CustomPainter exists
        working-directory: .
        run: |
          if ! grep -q "class DirectionalSpotlightCone" Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_overlay.dart; then
            echo "❌ P3.2b FAILED: DirectionalSpotlightCone widget missing"
            exit 1
          fi
          if ! grep -q "class _SpotlightConePainter" Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_overlay.dart; then
            echo "❌ P3.2b FAILED: _SpotlightConePainter missing"
            exit 1
          fi
          echo "✅ P3.2b: DirectionalSpotlightCone widget + painter present"

      - name: Verify P3.3 — FamilyBuildingAnimationEngine class exists
        working-directory: .
        run: |
          if ! grep -q "class FamilyBuildingAnimationEngine" Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart; then
            echo "❌ P3.3 FAILED: FamilyBuildingAnimationEngine class missing"
            exit 1
          fi
          # Verify it implements wedding 4s cycle + memorial 2.4s cycle
          if ! grep -q "weddingGlowCycle" Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart; then
            echo "❌ P3.3 FAILED: wedding glow cycle not referenced"
            exit 1
          fi
          if ! grep -q "memorialFlickerCycle" Daxelo-Kinrel-App/lib/features/family_map/widgets/family_building_layer.dart; then
            echo "❌ P3.3 FAILED: memorial flicker cycle not referenced"
            exit 1
          fi
          echo "✅ P3.3: FamilyBuildingAnimationEngine implements wedding + memorial animations"

      - name: Verify P3.4 — Avatar marker has gradient ring + selection halo
        working-directory: .
        run: |
          if ! grep -q "SweepGradient" Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_generator.dart; then
            echo "❌ P3.4 FAILED: SweepGradient (gradient ring) not in avatar marker generator"
            exit 1
          fi
          if ! grep -q "selectionHaloStrokeWidth\|selectionHaloRadiusPadding" Daxelo-Kinrel-App/lib/features/family_map/widgets/avatar_marker_generator.dart; then
            echo "❌ P3.4 FAILED: selection halo constants not referenced in avatar marker generator"
            exit 1
          fi
          echo "✅ P3.4: avatar marker has gradient ring (SweepGradient) + selection halo"

      - name: Verify P4.0 — focusMinZoom ≥ 16 (3D buildings visible on pin tap)
        working-directory: .
        run: |
          # P12.4 BUG FIX: focusMinZoom was 13.0 — at zoom 13, 3D buildings
          # had barely started fading in. Tapping any family member pin
          # parked the camera at a zoom where buildings were barely visible.
          # The only path to clear 3D was the hardcoded _flyToBengaluru3D()
          # debug button (zoom 16.5). Fix: raised to 16.5 so every pin tap
          # worldwide shows premium 3D.
          # REGRESSION GUARD: focusMinZoom must never drop below 16.
          if ! grep -q "focusMinZoom = 16.5" Daxelo-Kinrel-App/lib/features/family_map/config/map_visual_constants.dart; then
            echo "❌ P4.0 FAILED: focusMinZoom is not 16.5 (3D buildings invisible on pin tap)"
            echo "   This was the root cause of '3D only visible in Bengaluru' — do not regress."
            exit 1
          fi
          echo "✅ P4.0: focusMinZoom = 16.5 (3D buildings clearly visible on every pin tap worldwide)"

      - name: Verify P4.1 — Haptic feedback on tap + long-press
        working-directory: .
        run: |
          if ! grep -q "HapticFeedback.selectionClick" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P4.1 FAILED: HapticFeedback.selectionClick not on tap"
            exit 1
          fi
          if ! grep -q "HapticFeedback.heavyImpact" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P4.1 FAILED: HapticFeedback.heavyImpact not on long-press"
            exit 1
          fi
          echo "✅ P4.1: haptic feedback on tap (selectionClick) + long-press (heavyImpact)"

      - name: Verify P4.2 — Atmospheric perspective gated by pitch
        working-directory: .
        run: |
          # The polish overlay must accept a pitch parameter and use it
          # to gate atmospheric perspective (master prompt: pitch > 10°).
          if ! grep -q "this.pitch" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P4.2 FAILED: MapPolishOverlay does not accept a pitch parameter"
            exit 1
          fi
          if ! grep -q "atmosphericPerspectivePitchThreshold" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P4.2 FAILED: atmospheric perspective pitch threshold not referenced"
            exit 1
          fi
          # The screen must track pitch and pass it to the overlay.
          if ! grep -q "_currentPitch" Daxelo-Kinrel-App/lib/features/family_map/presentation/family_map_screen.dart; then
            echo "❌ P4.2 FAILED: _currentPitch not tracked in screen"
            exit 1
          fi
          echo "✅ P4.2: atmospheric perspective gated by pitch (threshold 10°, max 0.12)"

      - name: Verify P5.1 — WCAG AA label halos (2px, #0D0D0D)
        working-directory: .
        run: |
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          symbol_layers = [l for l in s['layers'] if l.get('type') == 'symbol']
          assert len(symbol_layers) > 0, 'no symbol layers found'
          for l in symbol_layers:
            paint = l.get('paint', {})
            if 'text-halo-color' in paint:
              assert paint['text-halo-width'] == 2.0, f'{l[\"id\"]}: text-halo-width is {paint[\"text-halo-width\"]}, expected 2.0'
              assert paint['text-halo-color'].upper() == '#0D0D0D', f'{l[\"id\"]}: text-halo-color is {paint[\"text-halo-color\"]}, expected #0D0D0D'
          "; then
            echo "❌ P5.1 FAILED: not all symbol layers have 2px / #0D0D0D halo"
            exit 1
          fi
          echo "✅ P5.1: all symbol layers have 2px text-halo-width + #0D0D0D halo color (WCAG AA)"

      - name: Verify P5.2 — Polish overlay merged into single CustomPainter
        working-directory: .
        run: |
          # The polish overlay should use a SINGLE CustomPainter (not a Stack
          # of multiple CustomPaint widgets) per master prompt Phase 5.
          if ! grep -q "class _KinrelPolishPainter" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P5.2 FAILED: _KinrelPolishPainter (merged single painter) not found"
            exit 1
          fi
          # Verify the old per-effect painters are GONE.
          if grep -q "class _VignettePainter\|class _FogPainter\|class _AmbientWarmthPainter" Daxelo-Kinrel-App/lib/features/family_map/widgets/map_polish_overlay.dart; then
            echo "❌ P5.2 FAILED: old per-effect painters still present (not merged)"
            exit 1
          fi
          echo "✅ P5.2: polish overlay merged into single _KinrelPolishPainter (1 draw call)"

      - name: Verify P5.3 — Vignette opacity is 0.45 (P12.1 ultra-premium)
        working-directory: .
        run: |
          # P12.1 ULTRA-PREMIUM: Vignette opacity bumped 0.40 → 0.45 for
          # stronger cinematic mood (darker corners focus attention on
          # ultra-premium 3D buildings + family beacons).
          if ! grep -q "vignetteOpacity = 0.45" Daxelo-Kinrel-App/lib/features/family_map/config/map_visual_constants.dart; then
            echo "❌ P5.3 FAILED: vignette opacity is not 0.45"
            exit 1
          fi
          echo "✅ P5.3: vignette opacity is 0.45 (P12.1 ultra-premium cinematic)"

      - name: Verify P12.2 — User premium style JSON invariants
        working-directory: .
        run: |
          # P12.2: User provided their own kinrel_dark_style.json with:
          #   - 117 layers (user-edited version)
          #   - building-3d + building-3d-warm-glow (height interpolation + warm glow)
          #   - kinrel-3d-buildings + kinrel-3d-buildings-warm-glow
          #   - family-buildings, family-buildings-glow, family-buildings-fallback
          #   - NO hillshade, NO roof, NO outer-halo (user removed these)
          if ! python3 -c "
          import json
          s = json.load(open('Daxelo-Kinrel-App/assets/map_styles/kinrel_dark_style.json'))
          layers = s['layers']
          assert len(layers) >= 115, f'expected at least 115 layers, got {len(layers)}'
          required = ['building-3d', 'building-3d-warm-glow', 'kinrel-3d-buildings',
                      'kinrel-3d-buildings-warm-glow', 'family-buildings',
                      'family-buildings-glow', 'family-buildings-fallback']
          for lid in required:
              assert any(l.get('id') == lid for l in layers), f'{lid} layer missing'
          "; then
            echo "❌ P12.2 FAILED: user style JSON invariants not satisfied"
            exit 1
          fi
          echo "✅ P12.2: user premium style JSON has all required layers (117 layers, warm-glow + family beacons)"


      - name: Verify P6.1 — New PlaceType values exist
        working-directory: .
        run: |
          if ! grep -q "vacationHome" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: vacationHome PlaceType missing"
            exit 1
          fi
          if ! grep -q "familyTemple" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: familyTemple PlaceType missing"
            exit 1
          fi
          if ! grep -q "grandparentsHome" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
            echo "❌ P6.1 FAILED: grandparentsHome PlaceType missing"
            exit 1
          fi
          # Verify wire names
          if ! grep -q "vacation_home" Daxelo-Kinrel-App/lib/features/family_map/data/place_models.dart; then
