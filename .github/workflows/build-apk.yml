# ─────────────────────────────────────────────────────────────────
# Build Flutter Debug APK — triggered on push to main + manual dispatch
# ─────────────────────────────────────────────────────────────────

name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install Android SDK & NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create .env file
        run: |
          cat > Daxelo-Kinrel-App/.env <<'EOF'
          SUPABASE_URL=https://promxswvsnvilplmrtsj.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb214c3d2c252aWxwbG1ydHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTcxODAsImV4cCI6MjA5NTE3MzE4MH0.70VPcCiCItKPx56cH-Y0DmcvWnrBiegmDkjv-V21taY
          API_BASE_URL=https://daxelo-kinrel-server.onrender.com
          EOF
          sed -i 's/^[[:space:]]*//' Daxelo-Kinrel-App/.env
          echo ".env file created"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            Daxelo-Kinrel-App/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('Daxelo-Kinrel-App/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: cd Daxelo-Kinrel-App && flutter pub get

      - name: Generate Drift code
        run: cd Daxelo-Kinrel-App && dart run build_runner build

      - name: Analyze Dart code
        run: cd Daxelo-Kinrel-App && flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests with coverage
        run: cd Daxelo-Kinrel-App && flutter test --coverage
        continue-on-error: true

      - name: Check Flutter coverage
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          cd Daxelo-Kinrel-App
          if [ -f coverage/lcov.info ]; then
            lcov --summary coverage/lcov.info 2>/dev/null || echo "Coverage summary unavailable"
            echo "✅ Flutter coverage report generated"
          else
            echo "⚠️  No lcov.info found — skipping coverage check"
          fi

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.run_number }}
          path: Daxelo-Kinrel-App/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build debug APK
        run: cd Daxelo-Kinrel-App && flutter build apk --debug --build-number=$GITHUB_RUN_NUMBER

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinrel-debug-apk-${{ github.run_number }}
          path: Daxelo-Kinrel-App/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
