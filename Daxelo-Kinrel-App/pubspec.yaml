name: kinrel
description: DAXELO KINREL — Indian Family Relationship Intelligence
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.8.1
  
  # Networking
  dio: ^5.8.0+1
  
  # Supabase
  supabase_flutter: ^2.8.4

  # Google Sign-In
  google_sign_in: ^6.2.1
  
  # Storage
  flutter_secure_storage: ^9.2.4

  # Local Database (Offline-First)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  drift_flutter: ^0.2.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Responsive
  responsive_framework: ^1.5.1
  
  # Animation
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  
  # Images
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  
  # UI Utilities
  shimmer: ^3.0.0
  flutter_svg: ^2.1.0+1
  smooth_page_indicator: ^1.2.0

  # PDF generation (v91: PDF export feature)
  pdf: ^3.11.2
  printing: ^5.14.2

  # Audio recording (v91: Oral history transcription feature)
  record: ^7.1.1

  # Audio playback (P1.1: Blessing Chain — elder voice blessings)
  just_audio: ^0.9.43

  # Flame engine (Ghost Painter canvas rendering)
  flame: ^1.18.0

  # Forge2D physics engine (Carrom game — BSD-3-Clause, Box2D port)
  forge2d: ^0.14.2

  # Chess logic engine (MIT+BSD — port of chess.js, pure logic, no UI)
  chess: ^0.8.1
  
  # Utilities
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  logger: ^2.6.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  in_app_review: ^2.0.9

  # SQLite for kinship matrix queries (downloaded from GitHub Releases)
  sqflite: ^2.4.1
  # Checksum verification for downloaded assets
  crypto: ^3.0.6

  # Media & Device
  image_picker: ^1.0.7
  # v62.4: file_selector for web-compatible image picker (image-only filter)
  file_selector: ^1.0.0
  # image_cropper removed — BUG-03: crashes on Android with "Reply already submitted"
  local_auth: ^2.2.0
  webview_flutter: ^4.7.0
  
  # Maps
  # maplibre: Modern MapLibre rewrite (FFI/JNI native, not the old maplibre_gl).
  # Verified on pub.dev: v0.3.5, supports Android/iOS/Web/Linux/macOS/Windows.
  # Uses MapLibre Native on Android/iOS, MapLibre GL JS on web.
  maplibre: ^0.3.5
  latlong2: ^0.9.1
  # geolocator: GPS capture for live location sharing on the Family Map.
  # Pinned to ^14.0.2 (not ^14.0.3) because 14.0.3 requires
  # package_info_plus ^10.0.0 which conflicts with our ^8.3.0.
  geolocator: ^14.0.2

  # Math/Graph
  collection: ^1.19.1
  flutter_dotenv: ^6.0.1

  # Firebase — Crash Reporting, Analytics & Push Notifications
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.5
  firebase_analytics: ^11.0.0
  firebase_messaging: ^15.2.5
  firebase_remote_config: ^5.0.0

  # Local Notifications (foreground FCM display)
  flutter_local_notifications: ^19.0.0
  socket_io_client: ^3.1.4
  app_links: ^7.1.1

  # QR Code generation
  qr_flutter: ^4.1.0

  # QR Code scanning (gated behind kEnableQrJoin)
  mobile_scanner: ^5.2.0

  # Contact picker (for "From Contacts" add-member flow)
  flutter_contacts: ^1.1.9+1

  # Text-to-speech for kinship pronunciation (gated behind kEnableAudioPronunciation)
  flutter_tts: ^4.2.0

  window_manager: ^0.4.3

  # Timezone support (required by flutter_local_notifications scheduling)
  timezone: ^0.10.1

  # P9.2e: Home-screen widgets (read-only widgets for today's highlight,
  # next occasion, daily brief preview)
  home_widget: ^0.7.0

  # ── Thermion — 3D rendering engine for Kinrel Cameo (B1 gate) ──
  # Fork of thermion_flutter 0.4.1 with objective_c 9.x compat patches.
  thermion_flutter:
    git:
      url: https://github.com/buildwith-manish/thermion-fork
      path: thermion_flutter
      ref: main
  thermion_dart:
    git:
      url: https://github.com/buildwith-manish/thermion-fork
      path: thermion_dart
      ref: main

# path_provider_foundation 2.6.0 requires objective_c ^9.2.1; thermion_flutter
# (forked) allows >=8.1.0 <10.0.0. Pin to 9.4.0 (last 9.x using hooks ^1.0.0).
dependency_overrides:
  objective_c: 9.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Testing
  mocktail: ^0.3.0
  # P5.5: Golden/visual-regression tests for painter output
  golden_toolkit: ^0.15.0
  
  # Code Generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  
  # Linting
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/kinship_core.json
    - assets/data/kinship_terms.json
    - assets/map_styles/
    - assets/cameo/kinrel_cameo_b1_test.glb
    - assets/cameo/placeholder_adult.glb
    # Modular 2D Cameo asset pack (158 PNGs).
    # Populated by scripts/setup_cameo_assets.sh from /kinrel-cameo/ at repo root.
    # The directory itself is gitignored — never commit the PNGs into the app.
    - assets/kinrel-cameo/
    - assets/kinrel-cameo/base-faces/
    - assets/kinrel-cameo/face-shapes/
    - assets/kinrel-cameo/skin-tones/
    - assets/kinrel-cameo/parts/eyes/
    - assets/kinrel-cameo/parts/eyebrows/
    - assets/kinrel-cameo/parts/eyelids/
    - assets/kinrel-cameo/parts/pupils/
    - assets/kinrel-cameo/parts/nose/
    - assets/kinrel-cameo/parts/mouth/
    - assets/kinrel-cameo/parts/hair/
    - assets/kinrel-cameo/parts/hair-front/
    - assets/kinrel-cameo/parts/hair-middle/
    - assets/kinrel-cameo/parts/hair-back/
    - assets/kinrel-cameo/clothing/
    - assets/kinrel-cameo/accessories/
    - assets/icons/
    - assets/icons/games/ghost-painter.png
    - assets/icons/games/freeze-dash.png
    - assets/icons/games/sos.png
    - assets/icons/games/antakshari.png
    - assets/icons/games/bingo.png
    - assets/icons/games/checkers.png
    - assets/icons/games/ludo.png
    - assets/icons/games/carrom.png
    - assets/icons/games/chess.png
    - assets/icons/games/chitmatch.png
    - assets/icons/games/nameplace.png
    - assets/icons/games/tictactoe.png
    - assets/icons/games/truthordare.png
    - assets/icons/games/twotruths.png
    - assets/icons/games/dotsboxes.png
    - assets/icons/games/hot-seat.png
    - assets/icons/games/relation-riddles.png
    - assets/icons/games/truth-streak.png
    - assets/images/
    - assets/fonts/
    - assets/privacy_policy.md
  
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
    # ── Bundled Indian script fonts (covers 80%+ of Indian users) ──
    # NotoSans: Latin + Devanagari (Hindi, Marathi, Nepali, Sanskrit)
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
