<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Indian Family Relationship Intelligence — map relationships in 14 Indian languages">
  <meta name="theme-color" content="#E8612A">

  <!-- Open Graph -->
  <meta property="og:title" content="Daxelo Kinrel">
  <meta property="og:description" content="Indian Family Relationship Intelligence — map relationships in 14 Indian languages">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Daxelo Kinrel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daxelo Kinrel</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #131416;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(232, 97, 42, 0.2);
      border-top-color: #E8612A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      color: #8A7A72;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading indicator shown until Flutter renders -->
  <div id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Kinrel…</div>
    </div>
  </div>

  <script>
    // ── Unregister stale service workers from previous deployments ──
    // Old service workers can cache stale assets and cause a blank
    // screen after a new deployment. We unregister ALL service workers
    // on every page load so the user always gets fresh content.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister().then(function(success) {
            if (success) console.log('Unregistered stale service worker');
          });
        }
      });
    }

    // ── Hide loading indicator once Flutter is ready ──
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(function() { loading.remove(); }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
