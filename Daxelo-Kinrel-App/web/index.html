<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Indian Family Relationship Intelligence — map relationships in 14 Indian languages">
  <meta name="theme-color" content="#E8612A">

  <!-- Open Graph -->
  <meta property="og:title" content="Daxelo Kinrel">
  <meta property="og:description" content="Indian Family Relationship Intelligence — map relationships in 14 Indian languages">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Daxelo Kinrel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daxelo Kinrel</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS — required by the maplibre (0.3.5) web plugin.
       The package's web implementation (maplibre_web) uses @ JS('maplibregl')
       which expects this global object to be available before the map widget
       initializes. Without this script tag, the map renders as a blank
       container on web.

       CDN: jsdelivr is used instead of unpkg because it has better uptime
       and faster global edge caching. The version is pinned to ^5.6
       (latest stable 5.x at time of writing) to avoid breaking changes
       from a 6.x release.

       The `defer` attribute is NOT used because the maplibre web plugin
       constructs `new maplibregl.Map(...)` synchronously during widget
       initialization — the global must be available immediately. -->
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- v13.0 — MapLibre map instance capture shim (Step 0 of v13 fix).
       The Flutter maplibre (0.3.5) web plugin wraps the underlying
       maplibregl.Map instance inside Dart state and does NOT expose it
       on window. This makes the v13 debugging protocol (running
       map.getPitch() / map.getBearing() / map.getZoom() /
       map.queryRenderedFeatures(...) in the JS console) impossible
       out of the box.

       This shim monkey-patches maplibregl.Map so that every instance
       the plugin constructs is recorded to window.__kinrelMaps and
       also surfaced as window.kinrelMap (the most recent one). The
       patch MUST load AFTER maplibre-gl.js (which it does — script
       order is preserved top-to-bottom without async/defer).

       Once captured, devtools can do:
         let map = window.kinrelMap
         map.getPitch()
         map.getBearing()
         map.getZoom()
         map.queryRenderedFeatures({layers: ['kinrel-3d-buildings']}).length
       -->
  <script>
    (function () {
      if (typeof window.maplibregl === 'undefined') {
        console.warn('[Kinrel v13] maplibregl not yet loaded — map-capture shim skipped');
        return;
      }
      var OriginalMap = window.maplibregl.Map;
      window.__kinrelMaps = [];
      window.kinrelMap = null;
      function PatchedMap(opts) {
        var inst = new OriginalMap(opts);
        try {
          window.__kinrelMaps.push(inst);
          window.kinrelMap = inst;
          console.log('[Kinrel v13] Captured maplibregl.Map instance #' +
                      window.__kinrelMaps.length +
                      ' → window.kinrelMap');
        } catch (e) {
          console.warn('[Kinrel v13] Failed to capture map instance:', e);
        }
        return inst;
      }
      PatchedMap.prototype = OriginalMap.prototype;
      // Copy static methods/properties (Style, NavigationControl, etc.)
      for (var k in OriginalMap) {
        if (Object.prototype.hasOwnProperty.call(OriginalMap, k)) {
          try { PatchedMap[k] = OriginalMap[k]; } catch (_) {}
        }
      }
      window.maplibregl.Map = PatchedMap;
      console.log('[Kinrel v13] maplibregl.Map patched — instances will be captured to window.kinrelMap');
    })();
  </script>

  <!-- PMTiles JS library — required by the maplibre (0.3.5) web plugin's
       pmtiles:// protocol handler.

       maplibre_web 0.3.5 auto-registers the `pmtiles://` protocol via
       `interop.addProtocol('pmtiles', pmtilesProtocol.tile)` in
       map_state.dart:48-49. But this code references a GLOBAL `pmtiles`
       object via @JS('pmtiles') — which means the pmtiles JS library
       MUST be loaded as a separate script tag here, before the map widget
       initializes.

       Without this script tag, the PMTiles protocol registration throws
       silently ("[MapLibre] PMTiles support could not be loaded") and any
       `pmtiles://` URLs in the map style will fail to load.

       Pinned to ^3.1 (3.0.0 does NOT ship dist/pmtiles.js — only
       dist/index.js — so the script tag 404'd and the pmtiles://
       protocol handler silently failed. Verified via:
         curl https://cdn.jsdelivr.net/npm/pmtiles@3.0.0/dist/pmtiles.js → 404
         curl https://cdn.jsdelivr.net/npm/pmtiles@3.1.0/dist/pmtiles.js → 200
       4.x has breaking API changes that maplibre_web 0.3.5 has not
       yet adopted. -->
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@3.1.0/dist/pmtiles.js"></script>

  <!-- Fallback: if jsdelivr fails (rare), try unpkg after 2 seconds.
       This ensures the map can still load even if one CDN is down. -->
  <script>
    window.addEventListener('load', function() {
      if (typeof maplibregl === 'undefined') {
        console.warn('[Kinrel] maplibre-gl.js failed to load from jsdelivr — trying unpkg fallback');
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js';
        script.onload = function() { console.log('[Kinrel] maplibre-gl.js loaded from unpkg fallback'); };
        script.onerror = function() { console.error('[Kinrel] maplibre-gl.js failed to load from both CDNs — map will not render'); };
        document.head.appendChild(script);

        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css';
        document.head.appendChild(link);
      }
      // PMTiles fallback — same pattern.
      if (typeof pmtiles === 'undefined') {
        console.warn('[Kinrel] pmtiles.js failed to load from jsdelivr — trying unpkg fallback');
        var pmtilesScript = document.createElement('script');
        pmtilesScript.src = 'https://unpkg.com/pmtiles@3.1.0/dist/pmtiles.js';
        pmtilesScript.onload = function() { console.log('[Kinrel] pmtiles.js loaded from unpkg fallback'); };
        pmtilesScript.onerror = function() { console.error('[Kinrel] pmtiles.js failed to load from both CDNs — pmtiles:// source URLs will not work'); };
        document.head.appendChild(pmtilesScript);
      }
    });
  </script>

  <style>
    /* v109.8: Prevent layout break on keyboard show / viewport resize.
       These rules ensure the Flutter web app fills the viewport
       correctly at ALL sizes — full-screen, half-screen, split-screen,
       and mobile browser with keyboard open. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    #flutter_host {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Ensure the maplibre map container (which maplibre_web appends to
       document.body) doesn't overlap the Flutter UI. The plugin creates
       a div with 100% width/height and appends it to body — we need to
       constrain it to the platform view container. */
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #131416;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(232, 97, 42, 0.2);
      border-top-color: #E8612A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      color: #8A7A72;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    // ── CRITICAL: Unregister ALL service workers BEFORE Flutter loads ──
    // This must run in <head> BEFORE flutter_bootstrap.js so that stale
    // service workers from previous deployments are removed before Flutter
    // tries to register a new one. Without this, the old service worker
    // can serve cached stale content (including old index.html files that
    // don't have this cleanup script), causing a blank screen.
    //
    // The registration is done synchronously (not async) to ensure it
    // completes before the body scripts load.
    if ('serviceWorker' in navigator) {
      // Force unregister all service workers
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister().then(function(success) {
            console.log('[SW] Unregistered stale service worker:', success);
          });
        }
      }).catch(function(e) {
        console.warn('[SW] Could not unregister service workers:', e);
      });

      // Also prevent Flutter from registering a NEW service worker by
      // overriding the serviceWorker.register API. Flutter's service
      // worker is deprecated and causes caching issues on web.
      // We only block flutter_service_worker.js, not all service workers.
      var originalRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
      navigator.serviceWorker.register = function(scriptUrl, options) {
        if (scriptUrl && scriptUrl.indexOf('flutter_service_worker') !== -1) {
          console.log('[SW] Blocked Flutter service worker registration (deprecated)');
          return Promise.resolve();
        }
        return originalRegister(scriptUrl, options);
      };
    }
  </script>
</head>
<body>
  <!-- Loading indicator shown until Flutter renders -->
  <div id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Kinrel…</div>
    </div>
  </div>

  <script>
    // ── Hide loading indicator once Flutter is ready ──
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(function() { loading.remove(); }, 300);
      }
    });

    // ── Failsafe: hide loading after 30s even if flutter-first-frame never fires ──
    // This prevents the user from being stuck on the loading spinner if
    // Flutter fails to render (e.g., due to a JavaScript error).
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        console.warn('[Kinrel] Flutter did not render within 30s — hiding loading indicator');
        loading.classList.add('hidden');
        setTimeout(function() { loading.remove(); }, 300);
      }
    }, 30000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
