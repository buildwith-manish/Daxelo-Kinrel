<!doctype html>
<html><head>
  <meta charset="utf-8"/>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>html,body{margin:0;padding:0;}#map{width:1280px;height:720px;}</style>
</head><body>
  <div id="map"></div>
  <script>
    const pmtilesProtocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);
    fetch('/kinrel_dark_style.json')
      .then(r => r.json())
      .then(style => {
        // Patch PMTiles source to OpenFreeMap's TileJSON URL for screenshot testing.
        // IMPORTANT: OpenFreeMap's source uses a TileJSON-style URL (just the
        // endpoint without /{z}/{x}/{y}.pbf) — MapLibre fetches the TileJSON
        // metadata from that URL to discover the tile template, maxzoom, etc.
        // Using a 'tiles' array with a /{z}/{x}/{y}.pbf template also works,
        // but TileJSON is what OpenFreeMap's own style uses and is more reliable.
        if (style.sources && style.sources.openmaptiles) {
          style.sources.openmaptiles = {
            type: 'vector',
            url: 'https://tiles.openfreemap.org/planet',
            attribution: '© OpenStreetMap contributors, © OpenFreeMap'
          };
        }

        // Patch multi-script fontstacks back to single-font for the screenshot
        // test only (see comment above). Production uses a self-hosted font
        // server that supports multi-script fontstacks.
        for (const layer of (style.layers || [])) {
          if (layer.type !== 'symbol') continue;
          const layout = layer.layout || {};
          if (!Array.isArray(layout['text-font']) || layout['text-font'].length <= 1) continue;
          // Take only the first font in the stack (the Latin one)
          layout['text-font'] = [layout['text-font'][0]];
        }

        const map = new maplibregl.Map({
          container: 'map',
          style: style,
          center: [0, 0],
          zoom: 13,
          pitch: 0,
          bearing: 0,
          attributionControl: false,
          // Critical for headless Chromium + SwiftShader:
          //   preserveDrawingBuffer: true keeps the WebGL buffer after composite,
          //     so readPixels and screenshot can capture the rendered content.
          preserveDrawingBuffer: true,
          failIfMajorPerformanceCaveat: false,
          preferCanvas: true,
        });
        window.__map = map;
      })
      .catch(err => {
        console.error('Style load failed:', err);
        document.body.innerHTML = '<pre style="color:red;padding:20px;">Style load failed: ' + err.message + '</pre>';
      });
  </script>
</body></html>
