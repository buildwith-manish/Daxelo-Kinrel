# =============================================================================
# Daxelo-Kinrel — Render Blueprint
# =============================================================================
# Native Node.js runtime — simpler and more reliable than Docker on Render.
# Uses rootDir: server to point Render at the NestJS project directory.
# Build command installs deps, generates Prisma client, and compiles TypeScript.
# Start command runs the compiled NestJS app.
# =============================================================================

services:
  - type: web
    name: daxelo-kinrel-server
    runtime: node
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
