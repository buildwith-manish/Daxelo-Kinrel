# =============================================================================
# Daxelo-Kinrel — Render Blueprint
# =============================================================================
# Native Node.js runtime — build command handles everything from repo root.
# =============================================================================

services:
  - type: web
    name: daxelo-kinrel-server
    runtime: node
    plan: free
    branch: main
    buildCommand: cd server && npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: cd server && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
