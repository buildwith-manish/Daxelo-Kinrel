services:
  - type: web
    name: daxelo-kinrel-server
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # ── App Config ───────────────────────────────
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: APP_NAME
        value: "Daxelo Kinrel"
      - key: PORT
        value: 10000
      # ── Database (set in Render dashboard) ───────
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # ── JWT (set in Render dashboard) ────────────
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: "15m"
      - key: JWT_REFRESH_EXPIRATION
        value: "7d"
      # ── 2FA Encryption (set in Render dashboard) ─
      - key: ENCRYPTION_KEY
        sync: false
      # ── Supabase (set in Render dashboard) ───────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Redis (set in Render dashboard) ──────────
      - key: REDIS_URL
        sync: false
      # ── Firebase (set in Render dashboard) ───────
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      # ── AI / LLM (set in Render dashboard) ───────
      - key: DEEPSEEK_API_KEY
        sync: false
      # ── Cloudinary (set in Render dashboard) ─────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Config (non-fatal validation) ────────────
      - key: STRICT_CONFIG
        value: "false"
      - key: LOG_LEVEL
        value: info
