# =============================================================================
# Daxelo-Kinrel — Render Blueprint
# =============================================================================
# Native Node.js runtime with build script from repo root.
# The render-build.sh handles cd into server/, npm ci, prisma generate, build.
# Start command runs from server/ directory.
# =============================================================================

services:
  - type: web
    name: daxelo-kinrel-server
    runtime: node
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: cd server && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
