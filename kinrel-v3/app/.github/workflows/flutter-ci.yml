# Daxelo-Kinrel Flutter App — CI
# ================================
# Runs on every push & PR. Jobs:
#   1. analyze  — flutter analyze (lint + typecheck)
#   2. test     — flutter test
#   3. build    — flutter build apk --debug (smoke build)
#   4. drift    — build_runner codegen check (drift .g.dart is committed & in sync)

name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  drift-codegen:
    name: Drift Codegen Check
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check for uncommitted generated files
        run: |
          if [ -n "$(git status --porcelain lib/)" ]; then
            echo "::error::Drift-generated files out of sync — run 'dart run build_runner build' and commit"
            git diff --stat lib/
            exit 1
          fi
          echo "✓ Drift codegen in sync"

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - run: flutter pub get

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  build-apk:
    name: Build APK (debug smoke)
    runs-on: ubuntu-latest
    needs: [analyze, test, drift-codegen]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daxelo-app-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
