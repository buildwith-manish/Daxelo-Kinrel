# Daxelo-Kinrel Flutter App — Vercel Web Preview Deploy
# =======================================================
# Although the Flutter app is primarily a mobile app, the suggestion sheet
# can be previewed on Vercel as a Flutter Web build for designers/QA.
# Uses secrets stored in the repo settings — never in the workflow file.
#
# Required repository secrets:
#   VERCEL_TOKEN             — Vercel access token
#   VERCEL_ORG_ID            — Vercel team/org ID
#   VERCEL_PROJECT_ID_APP    — Vercel project ID for the Flutter web app

name: Deploy Flutter Web Preview to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-flutter
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Flutter Web to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --no-tree-shake-icons

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy build/web to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy build/web --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr | tail -n 1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_APP }}

      - name: Monitor Vercel build until completion
        run: |
          # Reuse the server's monitor script — it just polls /v13/deployments
          node ../daxelo-kinrel-server/scripts/vercel/monitor-build.mjs \
            "${{ steps.deploy.outputs.deploy_url }}" \
            "${{ secrets.VERCEL_TOKEN }}" \
            "${{ secrets.VERCEL_ORG_ID }}"
