# Daxelo-Kinrel Server — Vercel Deploy
# =====================================
# Triggered on push to main (after CI passes). Uses secrets stored in the
# GitHub repo settings — NEVER in the workflow file itself.
#
# Required repository secrets (configure at:
# https://github.com/<owner>/<repo>/settings/secrets/actions):
#   VERCEL_TOKEN              — Vercel access token (scoped to this project only)
#   VERCEL_ORG_ID             — Vercel team/org ID
#   VERCEL_PROJECT_ID_SERVER  — Vercel project ID for the server
#
# The token only needs the "Deploy" scope. Revoke it any time from
# https://vercel.com/account/tokens

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:    # Allow manual trigger from the Actions tab

concurrency:
  group: vercel-deploy-server
  cancel-in-progress: false    # never cancel a deploy mid-flight

jobs:
  deploy:
    name: Deploy Server to Vercel
    runs-on: ubuntu-latest
    needs: []
    # Gate on CI — only deploy if CI passed on the same commit
    if: github.event_name == 'workflow_dispatch' || success()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr | tail -n 1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Monitor Vercel build until completion
        run: node scripts/vercel/monitor-build.mjs "${{ steps.deploy.outputs.deploy_url }}" "${{ secrets.VERCEL_TOKEN }}" "${{ secrets.VERCEL_ORG_ID }}"

      - name: Comment on commit with deploy URL
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.deploy_url }}`;
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const body = `${emoji} Vercel deploy ${status}: ${url}`;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
