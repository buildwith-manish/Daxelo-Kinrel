# Daxelo-Kinrel Server — CI
# ==========================
# Runs on every push & PR. Jobs:
#   1. lint-typecheck  — TypeScript compile + type errors
#   2. test            — Jest integration suite (53 tests)
#   3. build           — NestJS production build
#   4. prisma-validate — schema.prisma validity check
# Coverage gate: tests must pass before any deploy.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download vocabulary fixture
        run: |
          mkdir -p /home/z/my-project/download
          # The vocabulary JSON is generated from the Python script in the
          # main repo. For CI we either (a) check it into the repo, or
          # (b) regenerate it. Option (b) is cleaner — keeps the repo small.
          python3 ../../scripts/kinship_vocab_generator.py || true
        working-directory: ${{ github.workspace }}
        env:
          VOCAB_OUTPUT_DIR: /home/z/my-project/download

      - name: Generate vocabulary (in case the download above failed)
        run: |
          if [ ! -f /home/z/my-project/download/daxelo_kinrel_vocabulary.json ]; then
            echo "Vocabulary fixture missing — skipping test job until repo is bootstrapped."
            echo "Run scripts/kinship_vocab_generator.py locally and commit the JSON, or wire up an artifact download."
            exit 1
          fi

      - name: Run Jest suite
        run: npx jest --ci --coverage --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build NestJS server
        run: npm run build

      - name: Verify dist/ artifacts
        run: |
          test -f dist/main.js || (echo "dist/main.js missing" && exit 1)
          test -f dist/app.module.js || (echo "dist/app.module.js missing" && exit 1)
          echo "✓ Build artifacts present"

  prisma-validate:
    name: Prisma Schema Validate
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Validate schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Check for uncommitted generated artifacts
        run: |
          if [ -n "$(git status --porcelain prisma/)" ]; then
            echo "::warning::prisma/ has uncommitted changes after generate"
          fi
